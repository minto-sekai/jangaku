// 将来のポイント・帯・リーグ用に、回答の記録を端末に残しておく
// 形式: [時刻(秒), モード(d=デイリー n=何切る w=待ち q=名前), 評価(2=最善 1=向聴キープ 0=誤り), ヒント段階]
const LOG_CAP=3000;
function logEvent(mode,grade,hint){
  try{
    const log=JSON.parse(localStorage.getItem('jangaku-log')||'[]');
    log.push([Math.floor(Date.now()/1000),mode,grade,hint||0]);
    while(log.length>LOG_CAP)log.shift();
    localStorage.setItem('jangaku-log',JSON.stringify(log));
  }catch(e){}
}

function kindOf(t){return t<27?Math.floor(t/9):3;}
function naniCands(q,level){
  if(level<2)return null;
  const bt=bestTiles(q),n=Math.max(level===2?3:2,bt.length),out=[];
  for(const e of q.ev){if(out.length>=n)break;out.push(e.tile);}
  return out;
}
function hintMsg(kind,q,l){
  if(kind==='wait'){
    if(l===1)return T('wHintCount',{n:q.waits.length});
    return T(l===2?'wHintOne':'wHintTwo',{t:tileLabel(q.waits[l-2])});
  }
  if(l===1)return T('hintKind',{k:T('kinds')[kindOf(bestTiles(q)[0])]});
  return T(l===2?'hint3':'hint2');
}
function hintArea(kind,q,level,done){
  const max=kind==='wait'?Math.min(3,1+q.waits.length):3;
  const msgs=[];for(let l=1;l<=level;l++)msgs.push(hintMsg(kind,q,l));
  let html=msgs.length?cameo('ron','think',msgs.join('<br>')):'';
  if(!done&&level<max){
    const n=items.scrolls;
    html+=`<div class="row"><button class="btn ghost hint" data-hint="${kind}" ${n?'':'disabled'}>${T('useHint',{n})}</button></div>${n?'':`<p class="note">${T('noScroll')}</p>`}`;
  }
  return html;
}
function applyCands(sel,cands){
  if(!cands)return;
  document.querySelectorAll(sel).forEach(b=>{const t=+(b.dataset.t??b.dataset.dt);b.classList.add(cands.includes(t)?'glow':'dim');});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-hint]');if(!b||items.scrolls<1)return;
  const kind=b.dataset.hint,panel=b.closest('.panel').id;
  if(panel==='daily'){
    const r=rec(),cur=r.picks.length;if(cur>=5)return;
    r.hints=r.hints||[];r.hints[cur]=(r.hints[cur]||0)+1;saveDaily();
    items.scrolls--;saveItems();renderDaily();
  }else if(kind==='nani'&&naniQ&&!naniQ.done){
    naniQ.hint=(naniQ.hint||0)+1;items.scrolls--;saveItems();renderNani();
  }else if(kind==='wait'&&waitQ&&!waitQ.done){
    waitQ.hint=(waitQ.hint||0)+1;items.scrolls--;saveItems();renderWait();
  }

  $('#welcome-body').innerHTML=`<div class="wel-cast">${['chun','kan','ron'].map(w=>`<span class="av">${charSVG(w,w==='kan'?'normal':'happy')}</span>`).join('')}</div>

function applyLevel(){
  if(!userLevel)return;
  naniLevel={new:'easy',basic:'medium',pro:'hard'}[userLevel]||'medium';

  userLevel=b.dataset.level;try{localStorage.setItem('jangaku-level',userLevel);}catch(err){}track('level-'+userLevel);

// ===== ホーム =====
const PATH=[
 {k:'game',lesson:'game'},
 {k:'tiles',tab:'learn',scroll:'name-block',done:()=>stats.name.ok>=10},
 {k:'nanikiru',lesson:'nanikiru'},
 {k:'shanten',lesson:'shanten'},
 {k:'daily',tab:'daily',done:()=>Object.values(dstore.days).some(d=>(d.picks||[]).length>=5)},
 {k:'waits',lesson:'waits'},
 {k:'waitq',tab:'wait',done:()=>stats.wait.n>=10},
 {k:'naniq',tab:'nani',done:()=>stats.nani.n>=10},
];
function stepDone(st){return st.lesson?dojoDone.has(st.lesson):st.done();}
function stepText(st){
  if(st.lesson){const t=LESSONS[lessonIdx(st.lesson)].title;const L=t[LANG]||t.en;return [L[0],`${L[1]}（${T('tabDojo')}）`];}
  return [T('st_'+st.k),T('st_'+st.k+'_d')];
}
function stepAttr(st){return st.lesson?`data-lesson="${st.lesson}"`:`data-gotab="${st.tab}"${st.scroll?` data-scroll="${st.scroll}"`:''}`;}
function dailyDoneToday(){const r=dstore.days[todayKey()];return !!(r&&r.v===DAILY_V&&(r.picks||[]).length>=5);}
function renderHome(){
  const doneToday=dailyDoneToday(),r=dstore.days[todayKey()];
  const allDone=PATH.every(stepDone),nextIdx=PATH.findIndex(x=>!stepDone(x));
  let card;
  if((userLevel==='pro'||allDone)&&!doneToday)card={t:T('dStartTitle'),d:T('homeDailyD'),attr:'data-gotab="daily"',mood:'happy'};
  else if(nextIdx>=0){const [t,d]=stepText(PATH[nextIdx]);card={t,d,attr:stepAttr(PATH[nextIdx]),mood:'normal'};}
  else card={t:T('homeMoreT'),d:T('homeMoreD'),attr:'data-gotab="nani"',mood:'think'};
  const st=dailyStats();
  const cardIsDaily=card.attr==='data-gotab="daily"';
  const daily=cardIsDaily?'':doneToday
    ?`<div class="dailyrow done"><span>✓ ${T('homeDailyDone',{s:r.score})}</span><span class="note">${st.streak>1?T('homeStreak',{n:st.streak})+'　':''}${T('nextIn',{t:countdown()})}</span></div>`
    :`<button class="dailyrow" data-gotab="daily"><span><b>${T('tabDaily')}</b>　${T('homeDailyNot')}</span><span class="go">→</span></button>`;
  const doneN=PATH.filter(stepDone).length;
  const steps=PATH.map((x,i)=>{const d=stepDone(x),[t,ds]=stepText(x);return `<button class="step ${d?'done':''} ${i===nextIdx?'next':''}" ${stepAttr(x)}><span class="num">${d?'✓':i+1}</span><span class="st"><b>${t}</b><span>${ds}</span></span>${i===nextIdx?`<span class="nextbadge">${T('nextBadge')}</span>`:''}</button>`;}).join('');
  const more=[['dojo','ron','tabDojo','m_dojo'],['nani',null,'tabNani','m_nani',13],['wait',null,'tabWait','m_wait',22],['yaku',null,'tabYaku','m_yaku',33],['learn',null,'tabLearn','m_learn',27],['trivia','kan','tabTrivia','m_trivia']]
    .map(([tab,ch,lb,ds,tile])=>`<button class="more" data-gotab="${tab}"><span class="ic">${ch?`<span class="av">${charSVG(ch,'happy')}</span>`:tileEl(tile)}</span><b>${T(lb)}</b><span>${T(ds)}</span></button>`).join('');
  $('#home-body').innerHTML=`
    <div class="nextcard">
      <div class="nc-head"><span class="av">${chunSVG(card.mood)}</span><div><div class="nc-label">${T('nextUp')}</div><b>${card.t}</b><span>${card.d}</span></div></div>
      <button class="btn share" ${card.attr}>${T('letsGo')}</button>
    </div>
    ${daily}
    <details class="road" ${userLevel==='pro'||allDone?'':'open'}><summary><b>${T('pathH')}</b><span class="note">${T('pathDone',{d:doneN,n:PATH.length})}</span></summary><div class="steps">${steps}</div></details>
    <h3 class="sub">${T('tableH')}</h3>
    <p class="note">${T('tableIntro')}</p>
    <div class="mores tablecards">${[['score','ron','tabScore','m_score'],['riipai',null,'tabRiipai','m_riipai',0],['manner','kan','tabManner','m_manner']].map(([tab,ch,lb,ds,tile])=>`<button class="more" data-gotab="${tab}"><span class="ic">${ch?`<span class="av">${charSVG(ch,'normal')}</span>`:tileEl(tile)}</span><b>${T(lb)}</b><span>${T(ds)}</span></button>`).join('')}</div>
    <h3 class="sub">${T('moreH')}</h3>
    <div class="mores">${more}</div>
    ${SITE.hosted?`<div class="foot">${SITE.feedback?`<a class="link" href="${SITE.feedback}" target="_blank" rel="noopener">${T('feedbackLink')}</a>`:''}<a class="link" href="privacy.html">${T('privacyLink')}</a></div>`:''}`;
}
document.addEventListener('click',e=>{
  const sb=e.target.closest('[data-sub]');if(sb){showTab(sb.dataset.sub);return;}
  const gt=e.target.closest('[data-gotab]');
  if(gt&&!gt.closest('#dojo-body')){
    showTab(gt.dataset.gotab);
    const sc=gt.dataset.scroll&&document.getElementById(gt.dataset.scroll);
    if(sc)setTimeout(()=>sc.scrollIntoView({block:'start',behavior:'smooth'}),30);
  }
});

// --- 鳴いた牌の並び(横向きの牌つき) ---
function meldHTML(str,side){
  return `<span class="meld">${parse(str).map((t,i)=>i===side?`<span class="sidew">${tileEl(t)}</span>`:tileEl(t)).join('')}</span>`;
}

// --- 点数計算 ---
const up100=x=>Math.ceil(x/100)*100;
function basePts(han,fu){
  if(han>=13)return [8000,'yakuman'];if(han>=11)return [6000,'sanbaiman'];if(han>=8)return [4000,'baiman'];if(han>=6)return [3000,'haneman'];
  if(han>=5)return [2000,'mangan'];
  const b=fu*Math.pow(2,han+2);return b>2000?[2000,'over']:[b,null];
}
function payment(han,fu,dealer,tsumo){
  const [b,lim]=basePts(han,fu);
  if(!tsumo)return {kind:'ron',v:up100(b*(dealer?6:4)),b,lim};
  if(dealer)return {kind:'all',v:up100(b*2),b,lim};
  return {kind:'split',ko:up100(b),oya:up100(b*2),b,lim};
}
function fmtN(n){return n.toLocaleString(LANG==='es'?'es-ES':LANG==='en'?'en-US':'ja-JP');}
function payStr(p){if(p.kind==='ron')return T('ptRon',{v:fmtN(p.v)});if(p.kind==='all')return T('ptAll',{v:fmtN(p.v)});return T('ptSplit',{a:fmtN(p.ko),b:fmtN(p.oya)});}
let scoreQ=null,scoreLevel='limit';
function genScore(level){
  const dealer=Math.random()<.35,tsumo=Math.random()<.45;
  let han,fu;
  if(level==='limit'){han=5+rnd(9);fu=30;}
  else if(level==='basic'){han=1+rnd(4);fu=[30,40][rnd(2)];}
  else{
    for(;;){fu=[20,25,30,30,40,40,50,60,70][rnd(9)];han=1+rnd(6);if(fu===20&&(!tsumo||han<2))continue;if(fu===25&&han<2)continue;break;}
  }
  return {han,fu,dealer,tsumo,level};
}
function scoreOptions(q){
  const rp0=payment(q.han,q.fu,q.dealer,q.tsumo),right=payStr(rp0);
  const num=p=>p.kind==='split'?p.ko*2+p.oya:p.v;
  // 実際にありうる点数の中から、正解に近い額を選択肢にする
  const pool=new Map();
  const addP=p=>{const k=payStr(p);if(k!==right&&!pool.has(k))pool.set(k,Math.abs(num(p)-num(rp0)));};
  for(let h=1;h<=13;h++)for(const f of [20,25,30,40,50,60,70]){
    if(f===20&&(!q.tsumo||h<2))continue;if(f===25&&h<2)continue;
    addP(payment(h,f,q.dealer,q.tsumo));
  }
  addP(payment(q.han,q.fu,!q.dealer,q.tsumo));
  const near=[...pool.entries()].sort((x,y)=>x[1]-y[1]).slice(0,5).map(x=>x[0]);
  shuffle(near);
  return {right,opts:shuffle([right,...near.slice(0,3)])};
}
function scoreExplain(q){
  const p=payment(q.han,q.fu,q.dealer,q.tsumo),e=q.han+2,raw=q.fu*Math.pow(2,e);
  let s;
  if(p.lim==='over')s=T('exOver',{f:q.fu,e,raw:fmtN(raw)});
  else if(p.lim)s=T('exLimit',{h:q.han,name:T('lim_'+p.lim),b:fmtN(p.b)});
  else s=T('exBase',{f:q.fu,e,b:fmtN(p.b)});
  if(p.kind==='ron'){const m=q.dealer?6:4;s+=' '+T('exRon',{who:T(q.dealer?'oya':'ko'),m,raw:fmtN(p.b*m),v:fmtN(p.v)});}
  else if(p.kind==='split')s+=' '+T('exSplit',{b:fmtN(p.b),ko:fmtN(p.ko),b2:fmtN(p.b*2),oy:fmtN(p.oya)});
  else s+=' '+T('exAll',{b2:fmtN(p.b*2),v:fmtN(p.v)});
  return s;
}
function newScore(){const q=genScore(scoreLevel);scoreQ={...q,done:false,pick:null,...scoreOptions(q)};renderScore();}
function renderScore(){
  if(!scoreQ)return;const q=scoreQ;
  const qt=q.tsumo?(q.dealer?T('scoreQAll'):T('scoreQTsumo')):T('scoreQ');
  const badge=`<span class="sbadge">${T(q.dealer?'oya':'ko')}</span><span class="sbadge">${T(q.tsumo?'tsumo':'ron')}</span><span class="sbadge strong">${q.level==='limit'?T('hanOnly',{h:q.han}):T('hanfu',{h:q.han,f:q.fu})}</span>`;
  $('#score-card').innerHTML=`<div class="sbadges">${badge}</div><p class="sq">${qt}</p><div class="opts one">${q.opts.map(o=>`<button class="opt ${q.done?(o===q.right?'right':o===q.pick?'wrong':''):''}" data-sopt="${encodeURIComponent(o)}" ${q.done?'disabled':''}>${o}</button>`).join('')}</div>`;
  if(!q.done){$('#score-fb').innerHTML='';$('#score-next').hidden=true;}
}
$('#score-card').addEventListener('click',e=>{
  const b=e.target.closest('[data-sopt]');if(!b||scoreQ.done)return;
  const o=decodeURIComponent(b.dataset.sopt),ok=o===scoreQ.right;
  scoreQ.done=true;scoreQ.pick=o;
  stats.score.n++;if(ok)stats.score.ok++;saveStats();logEvent('s',ok?2:0,0);
  renderScore();
  $('#score-fb').innerHTML=react(ok,`<b>${scoreQ.right}</b><br>${scoreExplain(scoreQ)}`,'','score');
  $('#score-next').hidden=false;
});
$('#score-next').addEventListener('click',newScore);
$('#score-level').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;scoreLevel=b.dataset.lv;document.querySelectorAll('#score-level .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));newScore();});

// --- 理牌 ---
let rp=null;
function rpBest(){try{return +localStorage.getItem('jangaku-riipai-best')||0;}catch(e){return 0;}}
function newRiipai(){
  const wall=[];for(let i=0;i<34;i++)for(let k=0;k<4;k++)wall.push(i);shuffle(wall);
  rp={left:wall.slice(0,13),placed:[],t0:null,miss:0,done:false,time:0,newBest:false,shake:-1};renderRiipai();
}
function renderRiipai(){
  if(!rp)return;
  const best=rpBest();
  const placed=rp.placed.length?tilesRow(rp.placed):`<span class="note">—</span>`;
  const left=rp.left.map((t,i)=>`<button class="pick ${i===rp.shake?'shake':''}" data-rp="${i}">${tileEl(t)}</button>`).join('');
  let res='';
  if(rp.done){
    res=guide(rp.miss===0?'happy':'normal',`<b>${T('rpDone',{t:rp.time.toFixed(1),m:rp.miss})}</b>${rp.newBest?`<br>${T('rpNew')}`:''}`,rp.miss===0?'ok':'')+cameo('ron','normal',T('rpTip'))
      +`<div class="row"><button class="btn" id="rp-again">${T('rpAgain')}</button></div>`;
  }
  $('#riipai-body').innerHTML=`<div class="block">
    <div class="rphead"><span class="note">${T('rpMiss',{n:rp.miss})}</span><span class="note">${best?T('rpBest',{t:best.toFixed(1)}):''}</span></div>
    <p class="note"><b>${T('rpSorted')}</b></p><div class="hand rpsorted">${placed}</div>
    ${rp.done?'':`<p class="note"><b>${T('rpLeft')}</b></p><div class="hand rpleft">${left}</div>`}
    ${res}</div>`;
  rp.shake=-1;
}
$('#riipai-body').addEventListener('click',e=>{
  if(e.target.closest('#rp-again')){newRiipai();return;}
  const b=e.target.closest('[data-rp]');if(!b||rp.done)return;
  const i=+b.dataset.rp,t=rp.left[i],min=Math.min(...rp.left);
  if(rp.t0===null)rp.t0=performance.now();
  if(t===min){rp.placed.push(t);rp.left.splice(i,1);}
  else{rp.miss++;rp.shake=i;}
  if(!rp.left.length){
    rp.done=true;rp.time=(performance.now()-rp.t0)/1000;
    const best=rpBest();if(rp.miss===0&&(!best||rp.time<best)){rp.newBest=true;try{localStorage.setItem('jangaku-riipai-best',String(rp.time));}catch(err){}}
    logEvent('r',rp.miss===0?2:0,0);
  }
  renderRiipai();
});

let mq=null;
function newManner(){
  const order=shuffle(MANNER.map((_,i)=>i));
  mq={order,i:0,score:0,answered:null,qs:order.map(i=>{const m=MANNER[i];const side=m.meld?rnd(3):null;const ans=m.meld?side:0;return {m,side,ans,perm:shuffle([0,1,2])};})};
  renderManner();
}
function renderManner(){
  if(!mq)return;
  const n=mq.qs.length;
  if(mq.i>=n){
    const perfect=mq.score===n;
    $('#manner-body').innerHTML=`<div class="block dres"><h3>${T('mResult',{s:mq.score,n})}</h3></div>`+guide(perfect?'happy':'think',perfect?T('mPerfect'):T('ronManner'),perfect?'ok':'')+`<div class="row"><button class="btn" id="m-again">${T('mAgain')}</button><button class="btn ghost" data-lesson="naki">${T('lessonLink',{t:(LESSONS[lessonIdx('naki')].title[LANG]||LESSONS[lessonIdx('naki')].title.en)[0]})}</button></div>`;
    return;
  }
  const q=mq.qs[mq.i],L=q.m[LANG]||q.m.en,a=mq.answered;
  const vis=q.m.meld?`<div class="meldq">${meldHTML('555p',q.side)}</div>`:'';
  const opts=q.perm.map(k=>`<button class="opt ${a!==null?(k===q.ans?'right':k===a?'wrong':''):''}" data-mopt="${k}" ${a!==null?'disabled':''}>${L[1][k]}</button>`).join('');
  let fb='';
  if(a!==null)fb=`<div role="status">${guide(a===q.ans?'happy':'oops',`<b>${L[1][q.ans]}</b><br>${L[2]}`,a===q.ans?'ok':'ng')}</div><div class="row"><button class="btn" id="m-next">${T('next')}</button></div>`;
  $('#manner-body').innerHTML=`<div class="block"><p class="note">${T('mQ',{i:mq.i+1,n})}</p><p class="sq">${L[0]}</p>${vis}<div class="opts one">${opts}</div>${fb}</div>`;
}
$('#manner-body').addEventListener('click',e=>{
  if(e.target.closest('#m-again')){newManner();return;}
  if(e.target.closest('#m-next')){mq.i++;mq.answered=null;renderManner();return;}
  const b=e.target.closest('[data-mopt]');if(!b||mq.answered!==null)return;
  mq.answered=+b.dataset.mopt;const q=mq.qs[mq.i],ok=mq.answered===q.ans;
  if(ok)mq.score++;stats.manner.n++;if(ok)stats.manner.ok++;saveStats();logEvent('m',ok?2:0,0);
  renderManner();
});
