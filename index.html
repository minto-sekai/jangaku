<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雀学 Jangaku｜麻雀を基礎から</title>
<meta name="description" content="麻雀を基礎から学べる無料アプリ。毎日5問の何切る、キャラクターと学ぶ道場、点数計算や鳴きの作法まで。Learn riichi mahjong from scratch.">
<meta name="theme-color" content="#1D5244">
<meta property="og:type" content="website">
<meta property="og:title" content="雀学 Jangaku｜麻雀を基礎から">
<meta property="og:description" content="毎日5問の何切る、キャラクターと学ぶ道場、点数計算まで。無料・登録不要。">
<meta property="og:url" content="https://jangaku.netlify.app/">
<meta property="og:image" content="https://jangaku.netlify.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- アクセス解析(任意): GoatCounterを使う場合は、下の行の「YOURCODE」を自分のコードに変えて、コメントを外す
<script data-goatcounter="https://YOURCODE.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE8; --surface:#F6F8F6; --ink:#1B2723; --muted:#5A6A64; --line:#C9D4CF;
  --felt:#1D5244; --felt-2:#2A6A58; --on-felt:#EEF4EF;
  --red:#B8352A; --jade:#2B7A4B; --indigo:#27488A; --gold:#B8862B;
  --tile-face:#FBF9F1; --tile-edge:#E8E3D2; --tile-back:#2E7D5C;
  --ok-bg:#DDEFE3; --ng-bg:#F6E0DC; --ron-bg:#F3EBDD; --ron-line:#E2D5BC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10201B; --surface:#172A24; --ink:#E4ECE7; --muted:#9BB0A8; --line:#2C4239;
    --felt:#163F34; --felt-2:#1F5446; --on-felt:#E4ECE7;
    --ok-bg:#1E3B2B; --ng-bg:#43241F; --ron-bg:#332D22; --ron-line:#4A4130;
  }
}
:root[data-theme="dark"]{
  --bg:#10201B; --surface:#172A24; --ink:#E4ECE7; --muted:#9BB0A8; --line:#2C4239;
  --felt:#163F34; --felt-2:#1F5446; --on-felt:#E4ECE7;
  --ok-bg:#1E3B2B; --ng-bg:#43241F; --ron-bg:#332D22; --ron-line:#4A4130;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;}
h1,h2,h3{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;line-height:1.3;margin:0;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* 卓 */
.table{background:radial-gradient(120% 90% at 50% 0%,var(--felt-2),var(--felt));color:var(--on-felt);padding:28px 20px 22px;}
.table-in{max-width:760px;margin:0 auto;}
.table h1{font-size:44px;font-weight:800;letter-spacing:.08em;}
.table p{margin:4px 0 18px;opacity:.85;font-size:15px;}
#hero-tiles{display:flex;gap:4px;max-width:330px;}
#hero-tiles .tile{flex:1 1 0;}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:center;}
.tabs-in{display:flex;max-width:760px;width:100%;}
.tabs button{flex:1;background:none;border:0;padding:12px 4px 10px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);}

main{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
.panel h2{font-size:26px;margin:6px 0 6px;}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px;}
.note{color:var(--muted);font-size:14px;margin:2px 0 10px;}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:18px;}
.block h3{font-size:19px;margin-bottom:6px;}

/* 牌 */
.tile{display:inline-block;width:40px;aspect-ratio:3/4;background:linear-gradient(180deg,#fff 0%,var(--tile-face) 55%,var(--tile-edge) 100%);border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 3px 0 var(--tile-back),0 4px 6px rgba(0,0,0,.18);vertical-align:bottom;position:relative;}
.tile svg{display:block;width:100%;height:100%;}
.tile.big{width:84px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 6px 0 var(--tile-back),0 8px 14px rgba(0,0,0,.2);}
.tile.mini{width:26px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),0 2px 0 var(--tile-back);}
.tile.micro{width:18px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 1.5px 0 var(--tile-back);}
.hand{display:flex;gap:2px;margin:6px 0 10px;padding-bottom:4px;}
.hand .tile,.hand .pick{flex:1 1 0;min-width:0;max-width:46px;width:auto;}
.hand.small .tile{max-width:30px;}
.hand .pick .tile{width:100%;}

.basic{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px;}
.bx{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);}
.bx b{color:var(--ink);font-size:14px;}
.bx .hand{margin:0 0 4px;}
.tgroup{margin-bottom:22px;}
.tgroup h3{font-size:19px;}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:14px 8px;}
.tgrid figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;}
.tgrid .tile{width:44px;}
.tgrid figcaption{font-size:12px;color:var(--muted);text-align:center;line-height:1.35;}

.quiz{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-width:220px;}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-weight:700;}
.opt.right,.pick.right{background:var(--ok-bg);border-color:var(--jade);}
.opt.wrong,.pick.wrong{background:var(--ng-bg);border-color:var(--red);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
.stat{font-size:13px;color:var(--muted);margin-left:auto;}
.btn{background:var(--felt);color:var(--on-felt);border:0;border-radius:10px;padding:11px 20px;font-weight:700;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.yaku{border-bottom:1px solid var(--line);padding:16px 2px;}
.yaku header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.yaku h3{font-size:21px;}
.reading{font-size:13px;color:var(--muted);}
.han{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff;background:var(--muted);align-self:center;}
.han-1{background:#5E7C70}.han-2{background:var(--indigo)}.han-3{background:var(--jade)}.han-6{background:var(--red)}.han-ym{background:var(--gold)}
.yaku p{margin:6px 0 4px;}
.cond{font-size:13px;color:var(--muted);}

.pal{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0;}
.pick{background:none;border:2px solid transparent;border-radius:7px;padding:3px 2px 5px;display:flex;justify-content:center;}
.pal .tile{width:100%;max-width:40px;}
.pick[aria-pressed="true"]{border-color:var(--indigo);background:color-mix(in srgb,var(--indigo) 14%,transparent);}
.pick[aria-pressed="true"] .tile{transform:translateY(-4px);}
.pick.missed{border-color:var(--jade);border-style:dashed;}
.pal .pick.right{border-color:var(--jade);background:var(--ok-bg);border-style:solid;}
.pal .pick.wrong{border-color:var(--red);background:var(--ng-bg);}
.pick.cut.right{border-color:var(--jade);}
.pick.cut.wrong{border-color:var(--red);}
.pick.cut{padding:0 0 4px;border-width:0 0 3px;border-radius:0;}
.pick.cut:hover .tile{transform:translateY(-4px);}
.pick .tile{transition:transform .12s;}
@media (prefers-reduced-motion:reduce){.pick .tile{transition:none}}

.verdict{padding:10px 14px;border-radius:10px;font-weight:500;margin:14px 0 10px;}
.verdict.ok{background:var(--ok-bg);}
.verdict.ng{background:var(--ng-bg);}
.win{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap;}
.win-head{display:flex;align-items:center;gap:6px;font-size:13px;min-width:80px;}
.groups{display:flex;gap:8px;flex-wrap:wrap;}
.grp{display:flex;gap:1px;}
.scroll{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:14px;}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
td.num{font-variant-numeric:tabular-nums;}
tr.best td{background:var(--ok-bg);}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--indigo);}
.uke{display:flex;gap:1px;flex-wrap:wrap;min-width:120px;white-space:normal;}
@media (max-width:480px){
  .table h1{font-size:36px;}
  .basic{grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .tabs button{font-size:14px;}
}

/* 豆知識 */
.draw{background:var(--felt);color:var(--on-felt);border-radius:14px;padding:18px 16px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start;}
.draw .tile{flex:0 0 auto;width:46px;}
.draw-body{flex:1;min-width:0;}
.draw-kind{font-size:12px;opacity:.75;}
.draw h3{font-size:20px;margin:2px 0 6px;}
.draw p{margin:0 0 12px;font-size:15px;}
.draw .btn{background:var(--on-felt);color:var(--felt);}
.tv-sec{margin-bottom:26px;}
.tv-sec > h3{font-size:21px;margin-bottom:4px;}
.tv{border-bottom:1px solid var(--line);padding:12px 2px;}
.tv h4{margin:0;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.tv p{margin:4px 0 0;font-size:15px;}
.freq{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid currentColor;}
.freq-a{color:var(--jade)}.freq-b{color:var(--indigo)}.freq-c{color:var(--gold)}
.tv .hand{margin:8px 0 0;}
@media (max-width:480px){.tabs button{font-size:13px;padding:12px 2px 10px;}}

/* チュン */
.chun{display:inline-block;flex:0 0 auto;width:64px;line-height:0;}
.chun svg{width:100%;height:auto;display:block;overflow:visible;}
.hop{animation:hop .45s ease-out;}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-10px)}70%{transform:translateY(0)}85%{transform:translateY(-3px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.hop{animation:none}}
.guide{display:flex;gap:10px;align-items:flex-end;margin:6px 0 18px;}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:15px;}
.bubble b{font-weight:700;}
.guide.ok .bubble{background:var(--ok-bg);border-color:transparent;}
.guide.ng .bubble{background:var(--ng-bg);border-color:transparent;}
.block .guide{margin:14px 0 8px;}
.hero-top{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px;}
.hero-text{flex:1;min-width:0;}
.table p.hero-bubble{background:rgba(255,255,255,.13);border-radius:16px 16px 4px 16px;padding:10px 14px;margin:10px 0 0;font-size:15px;opacity:1;min-height:3.4em;}
.hero-chun{width:108px;background:none;border:0;padding:0;cursor:pointer;}
.draw .chun{width:64px;}
@media (max-width:480px){.hero-chun{width:92px;}}

/* 言語 */
.topbar{display:flex;justify-content:flex-end;margin:-8px 0 8px;}
.lang{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px;}
.lang button{background:none;border:0;color:var(--on-felt);font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;opacity:.75;}
.lang button[aria-pressed="true"]{background:var(--on-felt);color:var(--felt);opacity:1;}
.brand-sub{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;letter-spacing:.2em;opacity:.8;margin-top:2px;}
/* タブ(6つ) */
.tabs-in{overflow-x:auto;scrollbar-width:none;}
.tabs-in::-webkit-scrollbar{display:none;}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:12px 10px 10px;}
/* 脇役の吹き出し */
.guide.cameo{margin:-6px 0 10px;}
.guide.cameo .chun{width:48px;}
.guide.cameo .bubble{font-size:14px;}
.bubble .nm,.lb .nm{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px;letter-spacing:.04em;}
.guide.who-kan .bubble{background:#2B2E38;color:#EEF0F4;border-color:transparent;}
.guide.who-ron .bubble{background:var(--ron-bg);border-color:var(--ron-line);}
.link{background:none;border:0;padding:0;margin-top:6px;color:var(--indigo);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px;text-align:left;}
:root[data-theme="dark"] .link{color:#9DB6EC;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:#9DB6EC;}}
/* 道場 */
.sub{font-size:19px;margin:6px 0 10px;}
.av{display:inline-block;line-height:0;}
.av svg{width:100%;height:auto;display:block;overflow:visible;}
.lessons{display:grid;gap:10px;margin-bottom:26px;}
.lesson{display:grid;grid-template-columns:1fr auto;grid-template-areas:"ln faces" "t faces" "d faces";text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;gap:2px 10px;}
.lesson .ln{grid-area:ln;}
.lesson b{grid-area:t;font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;font-size:19px;}
.lesson .ld{grid-area:d;font-size:13px;color:var(--muted);}
.lesson .faces{grid-area:faces;display:flex;align-self:center;padding-left:8px;}
.faces .av{width:36px;margin-left:-8px;}
.ln{font-size:12px;color:var(--muted);font-weight:700;}
.donebadge{color:var(--jade);}
.casts{display:grid;gap:10px;}
.cast{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
.cast .av{width:64px;flex:0 0 auto;}
.cast p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.6;}
.backlink{background:none;border:0;padding:0;color:var(--muted);font-size:14px;margin-bottom:10px;}
.lesson-title{font-size:23px;margin:2px 0 16px;}
.stage{display:flex;flex-direction:column;gap:12px;min-height:120px;cursor:pointer;}
.line{display:flex;gap:8px;align-items:flex-end;max-width:94%;}
.line.right{flex-direction:row-reverse;align-self:flex-end;}
.line .av{width:52px;flex:0 0 auto;}
.lb{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.65;min-width:0;}
.line.left .lb{border-bottom-left-radius:4px;}
.line.right .lb{border-bottom-right-radius:4px;}
.who-chun .lb{background:var(--surface);border:1px solid var(--line);}
.who-kan .lb{background:#2B2E38;color:#EEF0F4;}
.who-ron .lb{background:var(--ron-bg);border:1px solid var(--ron-line);}
.line.new{animation:pop .3s ease-out;}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line.new{animation:none;}}
.ltiles{display:flex;gap:2px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.ltiles .arrow{margin:0 6px;font-weight:700;color:var(--jade);}
.tile.hl{box-shadow:0 0 0 2px var(--jade),0 2px 0 var(--tile-back);}
.lesson-end{text-align:center;padding:16px;background:var(--ok-bg);border-radius:14px;}
.lesson-end .row{justify-content:center;}
#dojo-ctrl{margin-top:16px;}

/* デイリー */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;}
.dhead b{font-size:17px;}
.dots{display:flex;gap:6px;}
.dot{width:16px;height:16px;border-radius:4px;background:var(--line);}
.dot.cur{outline:2px solid var(--ink);outline-offset:2px;}
.dot.g2{background:#3E9B5F;}.dot.g1{background:#D9A93B;}.dot.g0{background:#C4493B;}
details.cmp{margin-top:10px;}
details.cmp summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;padding:6px 0;}
.dres{text-align:center;}
.dres h3{font-size:21px;margin-bottom:10px;}
.vs{display:flex;justify-content:center;align-items:center;gap:22px;margin:4px 0 10px;}
.vs > div{display:flex;flex-direction:column;align-items:center;gap:2px;}
.vs .av{width:70px;}
.vs .vl{font-size:12px;color:var(--muted);font-weight:700;}
.vs b{font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif;font-size:34px;line-height:1;}
.vsx{font-weight:800;color:var(--muted);font-size:14px;}
.grid{font-size:28px;letter-spacing:4px;margin:6px 0 2px;}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 16px;}
.dstats b{display:block;font-size:24px;font-variant-numeric:tabular-nums;}
.dstats span{font-size:12px;color:var(--muted);}
.btn.share{background:var(--red);color:#fff;padding:13px 28px;font-size:16px;}
.copied{color:var(--jade);font-weight:700;margin:10px 0 0;}
.sharebox{width:100%;min-height:120px;margin-top:6px;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
.rv{border-bottom:1px solid var(--line);padding:10px 0;}
.rv-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:6px;}
.rv-h span{display:inline-flex;align-items:center;gap:4px;color:var(--muted);}
.rv-h .sq{font-size:16px;}

/* ヒント */
.btn.hint{margin-top:4px;}
.pick.glow .tile{box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(184,134,43,.55),0 3px 0 var(--tile-back);}
.pick.dim{opacity:.35;}
.toast{display:inline-block;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700;margin:8px 0;}
/* 難易度 */
.lv{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;vertical-align:1px;}
.lv-easy{color:var(--jade);}.lv-medium{color:var(--indigo);}.lv-hard{color:var(--red);}
:root[data-theme="dark"] .lv-medium{color:#9DB6EC;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lv-medium{color:#9DB6EC;}}
.kanmark{font-weight:700;}
.tabs::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:28px;background:linear-gradient(to right,transparent,var(--surface));pointer-events:none;}
/* 準正解 */
.dot.g15{background:#3E7FC4;}
.pick.near{border-color:#3E7FC4;background:color-mix(in srgb,#3E7FC4 14%,transparent);}
.pick.cut.near{border-color:#3E7FC4;}
tr.nearrow td{background:color-mix(in srgb,#3E7FC4 12%,transparent);}
/* 用語 */
details.gloss{margin:4px 0 8px;font-size:14px;}
details.gloss summary{cursor:pointer;color:var(--muted);font-weight:700;padding:4px 0;}
details.gloss > div{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:4px;line-height:1.8;}
/* デイリーの開始画面 */
.dstart{text-align:center;}
.dstart h3{font-size:21px;margin-bottom:6px;}
.dstart > p{margin:0 0 10px;}
.lvrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px;}
.vs.small .av{width:56px;}
/* 初回の案内 */

<script>
// ===== 牌データと計算ロジック =====
const KANJI=['一','二','三','四','五','六','七','八','九'];
const HONOR=['東','南','西','北','白','發','中'];
const NUMREAD=['イー','リャン','サン','スー','ウー','ロー','チー','パー','キュー'];
const HONORREAD=['トン','ナン','シャー','ペー','ハク','ハツ','チュン'];
function parse(str){
  const out=[];let buf='';
  for(const ch of str){
    if(/\d/.test(ch)) buf+=ch;
    else{const b={m:0,p:9,s:18,z:27}[ch];for(const d of buf)out.push(b+(+d)-1);buf='';}
  }
  return out;
}
function counts(arr){const c=new Array(34).fill(0);for(const t of arr)c[t]++;return c;}
function toList(c){const a=[];for(let i=0;i<34;i++)for(let k=0;k<c[i];k++)a.push(i);return a;}

// ===== 高速な向聴数計算(種類ごとに分解してキャッシュ) =====
const SUIT_CACHE=new Map();
function suitCombos(c,off,isHonor){
  let key='';for(let i=0;i<(isHonor?7:9);i++)key+=c[off+i];
  key=(isHonor?'z':'s')+key;
  let r=SUIT_CACHE.get(key);if(r)return r;
  const res=new Map();
  const a=[];for(let i=0;i<(isHonor?7:9);i++)a.push(c[off+i]);
  const n=a.length;
  function add(m,t,p){const k=m*100+t*10+p;res.set(k,[m,t,p]);}
  function dfs(i,m,t,p){
    while(i<n&&a[i]===0)i++;
    if(i>=n){add(m,Math.min(t,4),p);return;}
    if(a[i]>=3){a[i]-=3;dfs(i,m+1,t,p);a[i]+=3;}
    if(!isHonor&&i<=6&&a[i+1]&&a[i+2]){a[i]--;a[i+1]--;a[i+2]--;dfs(i,m+1,t,p);a[i]++;a[i+1]++;a[i+2]++;}
    if(a[i]>=2){a[i]-=2;if(!p)dfs(i,m,t,1);dfs(i,m,t+1,p);a[i]+=2;}
    if(!isHonor&&i<=7&&a[i+1]){a[i]--;a[i+1]--;dfs(i,m,t+1,p);a[i]++;a[i+1]++;}
    if(!isHonor&&i<=6&&a[i+2]){a[i]--;a[i+2]--;dfs(i,m,t+1,p);a[i]++;a[i+2]++;}
    a[i]--;dfs(i,m,t,p);a[i]++;
  }
  dfs(0,0,0,0);
  // 支配される組み合わせを除く
  const all=[...res.values()];
  r=all.filter(x=>!all.some(y=>y!==x&&y[0]>=x[0]&&y[1]>=x[1]&&y[2]>=x[2]&&(y[0]>x[0]||y[1]>x[1]||y[2]>x[2])));
  SUIT_CACHE.set(key,r);
  if(SUIT_CACHE.size>200000)SUIT_CACHE.clear();
  return r;
}
function normalShanten(c){
  const A=suitCombos(c,0,false),B=suitCombos(c,9,false),C=suitCombos(c,18,false),D=suitCombos(c,27,true);
  let best=8;
  for(const a of A)for(const b of B)for(const d of C)for(const e of D){
    const p=a[2]+b[2]+d[2]+e[2];if(p>1)continue;
    const m=a[0]+b[0]+d[0]+e[0],t=a[1]+b[1]+d[1]+e[1];
    const mm=Math.min(m,4);
    const s=8-2*mm-Math.min(t+(m-mm),4-mm)-p;
    if(s<best)best=s;
  }
  return best;
}

function chiitoiShanten(c){
  let pairs=0,kinds=0;for(const n of c){if(n>=1)kinds++;if(n>=2)pairs++;}
  return 6-pairs+Math.max(0,7-kinds);
}
const YAOCHU=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function kokushiShanten(c){let kinds=0,pair=0;for(const i of YAOCHU){if(c[i]>=1)kinds++;if(c[i]>=2)pair=1;}return 13-kinds-pair;}
function shanten(c){return Math.min(normalShanten(c),chiitoiShanten(c),kokushiShanten(c));}
function isAgari(c){return shanten(c)===-1;}

function melds(c,i){
  while(i<34&&!c[i])i++;
  if(i>=34)return [];
  if(c[i]>=3){c[i]-=3;const r=melds(c,i);c[i]+=3;if(r)return [[i,i,i],...r];}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const r=melds(c,i);c[i]++;c[i+1]++;c[i+2]++;if(r)return [[i,i+1,i+2],...r];}
  return null;
}
function decompose(c){
  for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;const g=melds(c,0);c[i]+=2;if(g)return [[i,i],...g];}
  if(chiitoiShanten(c)===-1){const g=[];for(let i=0;i<34;i++)if(c[i]>=2)g.push([i,i]);return g;}
  return null;
}
let RNG=Math.random;
function rnd(n){return Math.floor(RNG()*n);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

// 待ち当て問題
function genTenpai(mode){
  for(let tries=0;tries<500;tries++){
    const c=new Array(34).fill(0);
    let suits;
    if(mode==='chin') suits=[rnd(3)];
    else{ suits=shuffle([0,1,2]).slice(0,2); if(Math.random()<.5) suits.push(3); }
    const pick=()=>{const s=suits[rnd(suits.length)];return s===3?27+rnd(7):s*9+rnd(9);};
    const p=pick();c[p]+=2;
    let ok=true;
    for(let k=0;k<4;k++){
      let placed=false;
      for(let a=0;a<20&&!placed;a++){
        const t=pick();
        if(t<27&&Math.random()<.72){
          const st=t-(t%9)+rnd(7);
          if(c[st]<4&&c[st+1]<4&&c[st+2]<4){c[st]++;c[st+1]++;c[st+2]++;placed=true;}
        }else if(c[t]<=1){c[t]+=3;placed=true;}
      }
      if(!placed){ok=false;break;}
    }
    if(!ok)continue;
    const list=toList(c);
    const rm=list[rnd(list.length)];c[rm]--;
    const waits=[];
    for(let x=0;x<34;x++){if(c[x]>=4)continue;c[x]++;if(isAgari(c))waits.push(x);c[x]--;}
    if(!waits.length)continue;
    if(waits.length<2&&Math.random()<(mode==='chin'?.85:.7))continue;
    return {hand:toList(c),waits,suits:[...new Set(toList(c).map(t=>Math.min(3,Math.floor(t/9))))].sort()};
  }
  return null;
}

// 何切る
function evaluateDiscards(hand14){
  const c=counts(hand14);
  const res=[];
  for(let d=0;d<34;d++){
    if(!c[d])continue;
    c[d]--;
    const s=shanten(c);
    const tiles=[];let total=0;
    for(let x=0;x<34;x++){
      const remain=4-c[x]-(x===d?1:0);
      if(remain<=0)continue;
      c[x]++;
      if(shanten(c)<s){tiles.push(x);total+=remain;}
      c[x]--;
    }
    c[d]++;
    res.push({tile:d,shanten:s,tiles,total});
  }
  res.sort((a,b)=>a.shanten-b.shanten||b.total-a.total||a.tile-b.tile);
  return res;
}
// 初心者の定石(孤立字牌→1・9→つながりの少ない牌)で選ぶ牌
function simplePick(hand){
  const c=counts(hand);let best=null,bs=1e9;
  for(const t of new Set(hand)){
    let nb=0;
    if(t>=27)nb=c[t]-1;
    else{const s=Math.floor(t/9)*9;for(let d=-2;d<=2;d++){const u=t+d;if(u>=s&&u<s+9)nb+=c[u]-(d===0?1:0);}}
    const edge=t>=27?0:(t%9===0||t%9===8)?1:(t%9===1||t%9===7)?2:3;
    const sc=nb*10+edge;if(sc<bs){bs=sc;best=t;}
  }
  return best;
}
// 難易度
// easy  : 定石で解け、最善手に字牌がある、または最善手が2つある
// medium: 定石で解けるが最善手は数牌1つだけ、または定石では解けず最善手が2つ
// hard  : 定石では解けず、最善手が1つだけ
function classifyNani(hand,ev){
  const b=ev[0],bt=ev.filter(x=>x.shanten===b.shanten&&x.total===b.total).map(x=>x.tile);
  const hit=bt.includes(simplePick(hand));
  if(hit)return (bt.length===1&&bt[0]<27)?'medium':'easy';
  return bt.length===1?'hard':'medium';
}
function genNanikiru(level){
  level=level||'medium';
  for(let tries=0;tries<6000;tries++){
    const wall=[];for(let i=0;i<34;i++)for(let k=0;k<4;k++)wall.push(i);
    shuffle(wall);
    // 難しい問題ほど字牌を減らす(孤立字牌を切るだけの問題を避ける)
    const maxHonor=level==='easy'?14:level==='medium'?3:2;
    const hand=[];for(const t of wall){if(hand.length>=14)break;if(t>=27&&hand.filter(x=>x>=27).length>=maxHonor)continue;hand.push(t);}
    hand.sort((a,b)=>a-b);
    const s=shanten(counts(hand));
    if(s!==1&&s!==2)continue;
    const ev=evaluateDiscards(hand);
    const b=ev[0];
    if(ev.filter(x=>x.shanten===b.shanten&&x.total===b.total).length>2)continue;
    const lv=classifyNani(hand,ev);
    if(lv!==level&&tries<5900)continue;
    return {hand,ev,shanten:s,level:lv};
  }
  return null;
}

 {g:"ym",c:"closed",r:"Chuuren poutou",ex:"1112345678999m5m",ja:["九蓮宝燈","チューレンポウトウ","1種類の数牌で1112345678999の形に同じ種類の牌を1枚加える。"],en:["Nine gates","1112345678999 in one suit, plus any tile of that suit."],es:["Nueve puertas","1112345678999 de un palo más cualquier ficha del mismo palo."]},
 {g:"ym",c:"closed",r:"Tenhou / Chiihou",ex:"",ja:["天和・地和","テンホー・チーホー","親の配牌でアガリ(天和)。子の最初のツモでアガリ(地和)。"],en:["Blessing of heaven / earth","The dealer wins with the starting hand (tenhou), or a non-dealer wins on their first draw (chiihou)."],es:["Bendición del cielo / tierra","El repartidor gana con la mano inicial (tenhou) o un no repartidor gana con su primer robo (chiihou)."]},

const TV=[
 {c:"local",f:"b",ja:["人和(レンホー)","子が自分の最初のツモより前に、他家の捨て牌でロンでアガること。満貫とするルールと役満とするルールがあり、採用しない卓もある。"],en:["Renhou (Blessing of man)","A non-dealer wins by ron before their first draw. Counted as mangan or yakuman depending on the table, and some tables don't use it."],es:["Renhou (bendición del hombre)","Un no repartidor gana por ron antes de su primer robo. Vale mangan o yakuman según la mesa, y algunas no lo usan."]},
 {c:"local",f:"b",ex:"22334455667788p",ja:["大車輪(ダイシャリン)","2〜8の筒子を2枚ずつそろえた七対子。丸い牌が並ぶ様子を車輪に見立てた役満。"],en:["Daisharin (Big wheels)","Seven pairs of 2 to 8 of circles. The rows of round tiles look like wheels. Yakuman."],es:["Daisharin (grandes ruedas)","Siete parejas del 2 al 8 de círculos. Las fichas redondas parecen ruedas. Yakuman."]},
 {c:"local",f:"c",ja:["十三不塔(シーサンプーター)","配牌とツモの14枚で、面子も搭子もなく、対子が1つだけの状態。バラバラすぎて逆に役になる。満貫または役満扱い。"],en:["Shiisanpuutaa (Thirteen unconnected)","Your first 14 tiles have no melds and no partial sets, only one pair. So scattered it becomes a yaku: mangan or yakuman."],es:["Shiisanpuutaa (trece desconectadas)","Tus primeras 14 fichas no tienen grupos ni esperas parciales, solo una pareja. Tan dispersa que se vuelve yaku: mangan o yakuman."]},
 {c:"local",f:"c",ja:["石の上にも三年","ダブル立直をかけて、最後の牌(海底・河底)でアガること。辛抱が実った役満。"],en:["Three years on a rock","Declare double riichi and win on the very last tile. A yakuman for patience, named after a Japanese proverb about perseverance."],es:["Tres años sobre una roca","Declarar riichi doble y ganar con la última ficha. Un yakuman a la paciencia, con el nombre de un proverbio japonés sobre la perseverancia."]},
 {c:"local",f:"c",ex:"11223344556677z",ja:["大七星(ダイチーシン)","字牌7種を2枚ずつそろえた七対子。字一色に含まれるが、ダブル役満とする卓もある。"],en:["Daichisei (Big seven stars)","Seven pairs of all seven honors. It's already all honors, but some tables count it as double yakuman."],es:["Daichisei (siete grandes estrellas)","Siete parejas con los siete honores. Ya es todo honores, pero algunas mesas lo cuentan como doble yakuman."]},
 {c:"local",f:"b",ja:["八連荘(パーレンチャン)","親が8回連続でアガると、8回目は役がなくても役満になる。"],en:["Paarenchan (Eight in a row)","If the dealer wins eight times in a row, the eighth win is yakuman even without another yaku."],es:["Paarenchan (ocho seguidas)","Si el repartidor gana ocho veces seguidas, la octava es yakuman aunque no tenga otro yaku."]},
 {c:"local",f:"c",ex:"111555777s999s77z",ja:["紅孔雀(ベニクジャク)","索子の1・5・7・9と中だけで作る役満。赤い部分がある牌だけで作る、緑一色の対になる役。"],en:["Benikujaku (Red peacock)","Only 1, 5, 7, 9 of bamboo and the Red dragon: the tiles with red on them. A counterpart to all green."],es:["Benikujaku (pavo real rojo)","Solo 1, 5, 7 y 9 de bambú y el dragón rojo: las fichas con rojo. La contraparte del todo verde."]},
 {c:"rules",f:"a",ja:["喰いタン","鳴いた断么九を認めるかどうか。認めるルールを「アリ」と呼び、現在の雀荘やネット麻雀はほとんどがアリ。"],en:["Kuitan (Open tanyao)","Whether tanyao counts with called tiles. Tables that allow it are called 'ari', and almost all parlors and online games do."],es:["Kuitan (tanyao abierto)","Si el tanyao vale con fichas llamadas. Las mesas que lo permiten se llaman 'ari', y casi todos los salones y juegos en línea lo hacen."]},
 {c:"rules",f:"a",ja:["後付け(あとづけ)","役が確定していない状態で鳴き、あとから役を付けてアガること。認めない「完先(かんさき)」ルールも一部に残る。"],en:["Atozuke (Yaku later)","Calling tiles before your hand has a yaku, and completing the yaku later. Some tables ban it (the 'kansaki' rule)."],es:["Atozuke (yaku después)","Llamar fichas antes de tener yaku y completarlo después. Algunas mesas lo prohíben (regla 'kansaki')."]},
 {c:"rules",f:"a",ex:"5m5p5s",ja:["赤ドラ","五萬・五筒・五索のうち各1枚を赤く塗り、持っているだけでドラ1になる。枚数を増やしたり、金色のドラを入れたりする場所もある。"],en:["Red fives","One 5 of each suit is painted red and counts as a dora. Some places add more red tiles, or even gold ones."],es:["Cincos rojos","Un 5 de cada palo se pinta de rojo y cuenta como dora. En algunos lugares añaden más rojas, o incluso doradas."]},
 {c:"rules",f:"b",ja:["焼き鳥","半荘の間に一度もアガれなかった人が罰符を払う。アガると鳥のマークを裏返して「焼き鳥」を解除する。"],en:["Yakitori (Grilled chicken)","A player who never wins during the game pays a penalty. Winning flips your bird marker over, 'grilling' it."],es:["Yakitori (pollo a la parrilla)","Quien no gana ninguna mano en la partida paga una penalización. Al ganar, das la vuelta a tu marcador de pájaro y lo 'asas'."]},
 {c:"rules",f:"b",ja:["ワレメ","サイコロで決まった牌山の切れ目の位置にいる人は、その局の支払いと受け取りが倍になる。"],en:["Wareme (The split)","The player at the gap in the wall chosen by the dice pays and receives double that hand."],es:["Wareme (la apertura)","El jugador en la apertura del muro elegida por los dados paga y cobra el doble esa mano."]},
 {c:"rules",f:"c",ja:["白ポッチ","白に小さな印が付いた牌を1枚入れ、立直後にツモると好きな牌として使える。"],en:["Shiro pocchi (Dotted white)","A White dragon with a small dot acts as a wild tile if you draw it after riichi."],es:["Shiro pocchi (blanco con punto)","Un dragón blanco con un pequeño punto funciona como comodín si lo robas tras declarar riichi."]},
 {c:"rules",f:"b",ja:["ご祝儀(チップ)","一発・裏ドラ・赤ドラ・役満などで、点数とは別にチップを受け取るルール。フリー雀荘で多い。"],en:["Shuugi (Bonus chips)","Chips paid separately from points for ippatsu, ura dora, red fives, yakuman and so on. Common in parlors."],es:["Shuugi (fichas de bonificación)","Fichas que se pagan aparte de los puntos por ippatsu, ura dora, cincos rojos, yakuman, etc. Comunes en salones."]},
 {c:"rules",f:"a",ja:["三人麻雀(サンマ)","3人で遊ぶ形式で、萬子の2〜8を抜いて使うのが一般的。北を抜きドラにするルールが多く、関西で特に人気がある。"],en:["Sanma (Three-player)","Usually removes the 2 to 8 of characters, and North is often set aside as a bonus dora. Especially popular in the Kansai region."],es:["Sanma (a tres)","Normalmente se quitan del 2 al 8 de caracteres y el Norte suele apartarse como dora extra. Muy popular en la región de Kansai."]},
 {c:"abort",f:"a",ja:["九種九牌(キュウシュキュウハイ)","最初のツモの時点で么九牌が9種類以上あれば、流局を宣言できる。そのまま国士無双を狙ってもよい。"],en:["Kyuushu kyuuhai (Nine terminals)","If your first draw leaves you with 9 or more different terminals and honors, you may abort the hand. Or go for thirteen orphans!"],es:["Kyuushu kyuuhai (nueve terminales)","Si tras tu primer robo tienes 9 o más terminales y honores distintos, puedes anular la mano. ¡O ir a por trece huérfanos!"]},
 {c:"abort",f:"a",ja:["四風連打(スーフーレンダ)","最初の1巡目で4人全員が同じ風牌を切ると流局になる。"],en:["Suufon renda (Four winds)","All four players discard the same wind on the first go-around: the hand is aborted."],es:["Suufon renda (cuatro vientos)","Los cuatro jugadores descartan el mismo viento en la primera vuelta: la mano se anula."]},
 {c:"abort",f:"a",ja:["四家立直(スーチャリーチ)","4人全員が立直をかけると流局になる。"],en:["Suucha riichi (Four riichi)","All four players declare riichi: the hand is aborted."],es:["Suucha riichi (cuatro riichi)","Los cuatro jugadores declaran riichi: la mano se anula."]},
 {c:"abort",f:"a",ja:["四開槓(スーカイカン)","1局で合計4回カンされ、それが2人以上によるものだと流局になる。1人で4回なら四槓子の役満を狙える。"],en:["Suukaikan (Four kans)","Four kans are made in one hand by two or more players: the hand is aborted. If one player made all four, they can go for the four-quads yakuman."],es:["Suukaikan (cuatro kans)","Se hacen cuatro kans en una mano entre dos o más jugadores: la mano se anula. Si los hizo uno solo, puede ir a por el yakuman de cuatro kans."]},
 {c:"world",ja:["中国の公式ルール","1998年に国が定めた「国標麻雀」では役が81種類あり、合計8点以上でないとアガれない。立直やドラはない。"],en:["China's official rules","The 1998 national standard (Guobiao) has 81 scoring patterns, and you need at least 8 points to win. No riichi, no dora."],es:["Reglas oficiales de China","El estándar nacional de 1998 (Guobiao) tiene 81 patrones y necesitas al menos 8 puntos para ganar. Sin riichi ni dora."]},
 {c:"world",ja:["花牌(はなぱい)","中国・香港・台湾などでは、春夏秋冬や梅蘭菊竹を描いた花牌8枚を加えて144枚で遊ぶことが多い。引いたら横に出して補充し、点数の加算になる。"],en:["Flower tiles","China, Hong Kong and Taiwan often add 8 flower tiles (four seasons, four plants) for 144 in total. Drawn flowers are set aside, replaced, and add to your score."],es:["Fichas de flor","En China, Hong Kong y Taiwán suelen añadirse 8 flores (estaciones y plantas) hasta 144 fichas. Se apartan, se reponen y suman puntos."]},
 {c:"world",ja:["台湾麻雀は16枚","手牌が16枚で、5面子と1雀頭の17枚でアガる。点数は「台」で数え、親が連続でアガるとボーナスが付く。"],en:["Taiwanese mahjong uses 16 tiles","Hands have 16 tiles, and you win with 5 melds and a pair (17 tiles). Points are counted in 'tai', and a dealer's winning streak earns bonuses."],es:["El mahjong taiwanés usa 16 fichas","Las manos tienen 16 fichas y se gana con 5 grupos y una pareja (17). Los puntos se cuentan en 'tai' y las rachas del repartidor dan bonus."]},
 {c:"world",ja:["香港麻雀","花牌ありの広東式が主流で、点数は「番」で数える。最低何番以上でアガれるかを卓ごとに決めることが多い。"],en:["Hong Kong mahjong","The Cantonese style with flowers is standard, scored in 'fan'. Tables usually set a minimum fan needed to win."],es:["Mahjong de Hong Kong","Predomina el estilo cantonés con flores y se puntúa en 'fan'. Cada mesa suele fijar un mínimo de fan para ganar."]},
 {c:"world",ja:["アメリカ麻雀","ジョーカー牌を加えた152枚で遊ぶ。毎年発行される役のカードに載った形でしかアガれず、カードが変わるたびに攻略も変わる。"],en:["American mahjong","Played with 152 tiles including jokers. You can only win with hands printed on a card issued every year, so strategy changes with each new card."],es:["Mahjong americano","Se juega con 152 fichas, comodines incluidos. Solo se gana con manos impresas en una tarjeta que se publica cada año, así que la estrategia cambia con cada tarjeta."]},
 {c:"world",ja:["チャールストン","アメリカ麻雀で、配牌後に不要な牌を3枚ずつ左右や対面と交換する儀式。アガリ宣言は「マージャン!」。"],en:["The Charleston","In American mahjong, players pass unwanted tiles three at a time to the right, across and left after the deal. Winners call out 'Mahjong!'"],es:["El Charleston","En el mahjong americano, tras repartir se pasan fichas de tres en tres a derecha, enfrente e izquierda. Quien gana grita '¡Mahjong!'"]},
 {c:"world",ja:["動物牌","シンガポールやマレーシアの麻雀では、猫・ネズミ・鶏・ムカデを描いた動物牌が入る。猫とネズミがそろうとボーナスがもらえる。"],en:["Animal tiles","Singaporean and Malaysian mahjong add animal tiles: cat, rat, rooster and centipede. Getting the cat and rat together earns a bonus."],es:["Fichas de animales","En Singapur y Malasia se añaden gato, rata, gallo y ciempiés. Juntar el gato y la rata da un bonus."]},
 {c:"world",ja:["道具の違い","日本は牌が小さめで、全自動卓と点棒が一般的。中国や台湾の牌は大きめで、手で積む卓も多い。欧米の牌には読みやすいよう隅に算用数字が入ったものが多く、アメリカでは牌を立てるラックを使う。"],en:["Equipment differences","Japan uses smaller tiles, automatic tables and point sticks. Chinese and Taiwanese tiles are larger, and many tables are shuffled by hand. Western sets often have Arabic numerals in the corners, and American players use racks to hold their tiles."],es:["Diferencias de equipo","Japón usa fichas pequeñas, mesas automáticas y palillos de puntos. En China y Taiwán las fichas son más grandes y muchas mesas se barajan a mano. Los juegos occidentales suelen llevar números arábigos en las esquinas y en EE. UU. se usan atriles."]},
 {c:"world",ja:["捨て牌の置き方","日本では自分の前に6枚ずつきれいに並べるのが作法。中国や香港では卓の中央にまとめて置くスタイルも多く、誰が何を捨てたかを覚える力が問われる。"],en:["Where discards go","In Japan you line up your discards neatly in rows of six in front of you. In China and Hong Kong they're often tossed into the middle, so you have to remember who threw what."],es:["Dónde van los descartes","En Japón se colocan en filas ordenadas de seis frente a ti. En China y Hong Kong a menudo se tiran al centro, así que hay que recordar quién descartó qué."]},
 {c:"world",ja:["日本のお作法","始まりと終わりに「よろしくお願いします」「ありがとうございました」とあいさつし、牌を強く打ちつけない。発声してから鳴き、アガリは手牌を倒して見せる。"],en:["Japanese etiquette","Greet with 'yoroshiku onegaishimasu' at the start and 'arigatou gozaimashita' at the end, and don't slam tiles. Announce before calling, and lay down your hand to show your win."],es:["Etiqueta japonesa","Se saluda con 'yoroshiku onegaishimasu' al empezar y 'arigatou gozaimashita' al terminar, y no se golpean las fichas. Se anuncia antes de llamar y se tumba la mano para mostrar la victoria."]},
 {c:"world",ja:["香港の縁起担ぎ","広東語で「本(書)」は「負ける(輸)」と同じ発音なので、麻雀の席に本を持ち込むのを嫌う人がいる。旧正月は家族で麻雀を囲む定番の季節。"],en:["A Hong Kong superstition","In Cantonese, 'book' sounds like 'lose', so some players don't want books at the table. Lunar New Year is peak family mahjong season."],es:["Una superstición de Hong Kong","En cantonés, 'libro' suena como 'perder', así que algunos no quieren libros en la mesa. El Año Nuevo Lunar es la temporada estrella del mahjong en familia."]},
 {c:"words",ja:["テンパる","「聴牌(テンパイ)」から。あと1枚でアガれるが気が気でない状態が、余裕のない様子を表す言葉として広まった。"],en:["Tenparu","From 'tenpai'. In everyday Japanese it means being flustered and out of room, like waiting nervously for that one tile."],es:["Tenparu","Viene de 'tenpai'. En japonés cotidiano significa estar agobiado, como quien espera nervioso esa única ficha."]},
 {c:"words",ja:["安全牌","相手に当たらない牌のこと。転じて「無難な選択」や「当たり障りのない人」の意味でも使われる。"],en:["Anzenpai (Safe tile)","A tile that can't be ronned. In Japanese it also means a safe choice, or a harmless person."],es:["Anzenpai (ficha segura)","Una ficha con la que no te pueden hacer ron. En japonés también significa una opción segura o una persona inofensiva."]},
 {c:"words",ja:["面子(メンツ)","麻雀の3枚1組を指す言葉。「メンツが足りない」のように、集まる顔ぶれの意味でも日常的に使う。"],en:["Mentsu","The word for a meld. In Japanese it also means the group of people who gather, as in 'we don't have enough mentsu'."],es:["Mentsu","La palabra para un grupo de fichas. En japonés también designa a la gente que se reúne, como en 'no tenemos suficientes mentsu'."]},
 {c:"words",ja:["チョンボ","ルール違反のミスで罰符を払うこと。日常でも「うっかりミス」の意味で使われる。"],en:["Chombo","A rules violation that costs a penalty. In everyday Japanese it means a careless blunder."],es:["Chombo","Una infracción que se paga con penalización. En japonés cotidiano significa un descuido."]},
 {c:"words",ja:["麻雀という名前","「雀」はスズメ。牌をかき混ぜる音がスズメのさえずりに似ているから、という説が有名だが諸説ある。"],en:["The name 'mahjong'","The second character, 雀, means sparrow. A popular theory says shuffling tiles sounds like sparrows chirping, but there are others."],es:["El nombre 'mahjong'","El segundo carácter, 雀, significa gorrión. Una teoría popular dice que barajar las fichas suena como gorriones piando, pero hay otras."]},
 {c:"misc",ja:["立直は日本生まれ","中国の麻雀には立直がない。ドラや一発などとともに、日本で発展した独自のルール。"],en:["Riichi was born in Japan","Chinese mahjong has no riichi. Along with dora and ippatsu, it's a rule that developed in Japan."],es:["El riichi nació en Japón","El mahjong chino no tiene riichi. Junto con el dora y el ippatsu, es una regla desarrollada en Japón."]},
 {c:"misc",ja:["1索はなぜ鳥なのか","多くの牌で1索には鳥(孔雀や雀)が描かれる。細い竹1本では見分けにくいためとも、牌の意匠の名残ともいわれ、はっきりした由来は分かっていない。"],en:["Why is the 1 of bamboo a bird?","On many sets the 1 of bamboo shows a bird, such as a peacock or sparrow. Some say a single stick was too hard to tell apart; others say it's an old design tradition. Nobody knows for sure."],es:["¿Por qué el 1 de bambú es un pájaro?","En muchos juegos el 1 de bambú muestra un pájaro, como un pavo real o un gorrión. Unos dicen que un solo palo era difícil de distinguir y otros que es una tradición de diseño. Nadie lo sabe con certeza."]},
 {c:"misc",ja:["白は何も描かれていない","白は無地、または枠だけの牌。昔は牌をなくしたときの予備として使われたという話もある。"],en:["The White dragon is blank","The White dragon is plain or just a frame. Some say it was once used as a spare to replace lost tiles."],es:["El dragón blanco está en blanco","El dragón blanco es liso o solo tiene un marco. Se dice que antes servía de repuesto para fichas perdidas."]},
 {c:"misc",ja:["天和の確率","親の配牌でアガっている確率は約33万分の1といわれる。一生に一度見られるかどうかの役満。"],en:["Odds of tenhou","The chance that the dealer's starting hand is already a win is said to be about 1 in 330,000. A once-in-a-lifetime yakuman."],es:["Probabilidad del tenhou","Se dice que la probabilidad de que la mano inicial del repartidor ya sea ganadora es de 1 entre 330.000. Un yakuman de una vez en la vida."]},
 {c:"misc",ex:"1112345678999p",ja:["九蓮宝燈の迷信","「アガると運を使い果たして死ぬ」という冗談めいた言い伝えがあるほど珍しい役満。純正形は9面待ちになる。"],en:["The Nine Gates curse","So rare there's a joke that winning it uses up all your luck and you'll die. The pure form waits on nine different tiles."],es:["La maldición de las nueve puertas","Es tan raro que se bromea con que ganarlo agota tu suerte y te mueres. La forma pura espera nueve fichas distintas."]},
 {c:"misc",ex:"19m19p19s1234567z",ja:["国士無双13面待ち","么九牌13種を1枚ずつ持った形は、13種どれでもアガれる。ダブル役満とするルールも多い。"],en:["The 13-sided thirteen orphans wait","Holding one of each of the 13 terminals and honors, any of those 13 tiles wins. Many rules count it as double yakuman."],es:["La espera de 13 lados de trece huérfanos","Con una de cada una de las 13 terminales y honores, cualquiera de esas 13 gana. Muchas reglas lo cuentan como doble yakuman."]},
 {c:"misc",ja:["25000点持ちの30000点返し","配給原点は25000点だが、精算は30000点を基準にする。差額はトップ賞(オカ)としてトップの人に入る。"],en:["Start at 25,000, settle at 30,000","Everyone starts with 25,000 points, but final scores are measured against 30,000. The difference goes to first place as a top bonus (oka)."],es:["Empezar con 25.000, liquidar con 30.000","Todos empiezan con 25.000 puntos, pero al final se mide contra 30.000. La diferencia va al primero como bonus (oka)."]},
];

{id:"game",title:{ja:["麻雀ってどんなゲーム？","人数・勝ち方・戦い方"],en:["What is mahjong?","Players, winning and strategy"],es:["¿Qué es el mahjong?","Jugadores, cómo ganar y estrategia"]},nextTab:"learn",lines:[
 {s:"chun",m:"happy",ja:"ボク、麻雀をやってみたいんだけど、どんなゲームなのか全然わからないチュン。",en:"I want to try mahjong, but I have no idea what kind of game it is.",es:"Quiero probar el mahjong, pero no tengo ni idea de qué tipo de juego es."},
 {s:"ron",m:"happy",t:"1234z",ja:"ほっほっ、まずは全体の流れからじゃ。麻雀はふつう4人で遊ぶ。テーブルを囲んで、東・南・西・北の席に座るのじゃ。",en:"Ho ho, let's start with the big picture. Mahjong is usually played by four people, seated around a table as East, South, West and North.",es:"Jo, jo, empecemos por lo general. El mahjong suele jugarse entre cuatro personas, sentadas alrededor de una mesa como Este, Sur, Oeste y Norte."},
 {s:"ron",m:"normal",ja:"使う牌(パイ)は136枚。最初に1人13枚ずつ配られる。自分の手元の牌を「手牌(てはい)」と言うのじゃ。",en:"There are 136 tiles. Each player starts with 13. The tiles in front of you are your hand.",es:"Hay 136 fichas. Cada jugador empieza con 13. Las fichas que tienes delante son tu mano."},
 {s:"chun",m:"think",ja:"配られたら、どうするの？",en:"Then what?",es:"¿Y luego?"},
 {s:"ron",m:"normal",t:"234m67m345p678p78s",d:"4z",ja:"順番に、山から1枚引いて、いらない1枚を捨てる。これをくり返すのじゃ。引くことを「ツモ」、捨てることを「切る」と言う。",en:"Players take turns drawing a tile and discarding one they don't need, over and over. Drawing is called 'tsumo' and discarding is called 'kiru' (cutting).",es:"Por turnos, cada uno roba una ficha y descarta la que no necesita, una y otra vez. Robar se dice 'tsumo' y descartar, 'kiru' (cortar)."},
 {s:"chun",m:"think",ja:"何をしたら勝ちなの？",en:"So how do you win?",es:"¿Y cómo se gana?"},
 {s:"ron",m:"normal",t:"234m555p678s111z77s",ja:"手牌を決まった形にそろえたら「アガリ」じゃ。形は「3枚の組が4つ＋同じ牌2枚が1つ」で、合わせて14枚。",en:"Arrange your hand into a set shape and you win the hand. The shape is four groups of three plus one pair: 14 tiles in all.",es:"Si ordenas tu mano en una forma concreta, ganas la mano: cuatro grupos de tres y una pareja, 14 fichas en total."},
 {s:"kan",m:"normal",ja:"3枚の組ってのは？",en:"Groups of three, like what?",es:"¿Grupos de tres, como qué?"},
 {s:"ron",m:"normal",t:"234m555p",ja:"同じ種類で数字が続く3枚か、まったく同じ牌3枚じゃ。",en:"Either three in a row of the same suit, or three identical tiles.",es:"O tres seguidas del mismo palo, o tres fichas idénticas."},
 {s:"ron",m:"normal",ja:"アガり方は2つ。最後の1枚を自分で引いたら「ツモ」、ほかの人が捨てた牌で完成したら「ロン」と言ってアガれる。",en:"There are two ways to win: complete your hand with a tile you draw yourself and call 'tsumo', or with a tile someone else discards and call 'ron'.",es:"Hay dos formas de ganar: completar la mano con una ficha que robas tú y decir 'tsumo', o con una ficha que descarta otro y decir 'ron'."},
 {s:"kan",m:"angry",ja:"ロンされたら、その牌を捨てたやつが点を払うのか？",en:"So if someone rons off my discard, I pay?",es:"¿Entonces si alguien hace ron con mi descarte, pago yo?"},
 {s:"ron",m:"stern",ja:"そうじゃ。ロンなら捨てた人が、ツモなら残りの全員が点を払う。みんな25,000点から始めて、何回か遊んだ後に一番点数が多い人が勝ちじゃ。",en:"Yes. On a ron the discarder pays, and on a tsumo everyone else pays. Everyone starts with 25,000 points, and after several hands, whoever has the most wins.",es:"Sí. Con ron paga quien descartó, y con tsumo pagan todos los demás. Todos empiezan con 25.000 puntos y, tras varias manos, gana quien tenga más."},
 {s:"chun",m:"think",ja:"どうやって戦えばいいの？",en:"How should I play, then?",es:"¿Y cómo debo jugar?"},
 {s:"ron",m:"normal",ja:"大事なのは2つ。1つは、いらない牌を上手に選んで、早くアガリの形に近づけること。もう1つは、ほかの人がアガりそうなとき、その人に当たる牌を捨てないことじゃ。",en:"Two things matter. First, choose your discards well to reach the winning shape quickly. Second, when someone else is close to winning, avoid discarding the tile they need.",es:"Dos cosas importan. Primero, elegir bien tus descartes para llegar rápido a la forma ganadora. Segundo, cuando otro está cerca de ganar, no descartar la ficha que necesita."},
 {s:"ron",m:"normal",ja:"もう1つ、アガるには「役(やく)」という条件が必要じゃが、それは慣れてからでよい。",en:"One more rule: to win you need at least one 'yaku' (a scoring pattern). You can learn that once you're comfortable.",es:"Una regla más: para ganar necesitas al menos un 'yaku' (un patrón de puntuación). Puedes aprenderlo cuando te sientas cómodo."},
 {s:"kan",m:"happy",ja:"よし、早くアガって、相手には当たらない！覚えたぜ！",en:"Got it: win fast, don't feed the others! Caw!",es:"Entendido: ganar rápido y no regalar fichas. ¡Cra!"},
 {s:"chun",m:"happy",ja:"次は牌の種類を覚えて、それから「何切る」だね！",en:"Next I'll learn the tiles, then 'what to discard'!",es:"¡Lo siguiente es aprender las fichas y luego '¿qué descarto?'!"},
]},
{id:"nanikiru",title:{ja:["「何切る」ってなに？","1枚引いて、1枚捨てる"],en:["What is 'what to discard'?","Draw one, discard one"],es:["¿Qué es '¿qué descarto?'?","Roba una, descarta una"]},lines:[
 {s:"chun",m:"think",ja:"「何切る」ってよく聞くけど、何のことチュン？",en:"People keep saying 'nanikiru'... what is it?",es:"Todos dicen 'nanikiru'... ¿qué es?"},
 {s:"ron",m:"normal",ja:"麻雀では、自分の番が来るたびに山から1枚引く。これをツモと言うのじゃ。",en:"In mahjong, every turn you draw one tile from the wall. That's called a draw (tsumo).",es:"En el mahjong, en cada turno robas una ficha del muro. Eso se llama robo (tsumo)."},
 {s:"ron",m:"normal",t:"234m67m345p678p78s",d:"4z",ja:"手牌は13枚。1枚引くと14枚になる。",en:"Your hand has 13 tiles. After drawing, you have 14.",es:"Tu mano tiene 13 fichas. Al robar, tienes 14."},
 {s:"chun",m:"think",ja:"14枚のままだとどうなるの？",en:"What happens with 14?",es:"¿Y qué pasa con 14?"},
 {s:"ron",m:"normal",ja:"アガリでなければ、1枚捨てて13枚に戻す。これを「切る」と言う。どれを切るか考える問題が「何切る」じゃ。",en:"Unless you've won, you discard one tile to get back to 13. Choosing which one to discard is what a 'what to discard' puzzle (nanikiru) is about.",es:"Si no has ganado, descartas una ficha para volver a 13. Elegir cuál descartar es de lo que tratan los problemas de '¿qué descarto?' (nanikiru)."},
 {s:"kan",m:"happy",ja:"要らない牌を捨てればいいんだろ？",en:"Just toss the useless one, right? Caw!",es:"Tira la inútil y ya, ¿no? ¡Cra!"},
 {s:"ron",m:"normal",ja:"そうじゃ。アガリの形は「3枚の組×4＋2枚の組×1」。どの組にもなりそうにない牌が、要らない牌じゃ。",en:"Right. A winning hand is four sets of three plus one pair. A tile that can't join any set is the useless one.",es:"Así es. Una mano ganadora son cuatro grupos de tres y una pareja. La ficha que no puede formar ningún grupo es la inútil."},

   ng:{ja:"その牌は、となりの牌と組になれそうじゃ。どの牌ともつながらない牌を探すのじゃ。",en:"That tile could join its neighbors. Look for a tile that connects with nothing.",es:"Esa ficha podría unirse a sus vecinas. Busca una que no conecte con nada."}},
   ja:"では、この14枚から1枚切ってみよ。",en:"Now, discard one tile from these 14.",es:"Ahora, descarta una de estas 14."},
 {s:"ron",m:"happy",ja:"見事じゃ。問題ではさらに「受け入れ」、つまり次に引いたときに手が進む牌の多さを比べて、一番良い1枚を選ぶ。それは次のレッスンで学ぶのじゃ。",en:"Well done. The puzzles also compare acceptance, how many future draws would move your hand forward, to find the single best tile. That's the next lesson.",es:"Muy bien. Los problemas también comparan la aceptación, cuántos robos futuros harían avanzar tu mano, para hallar la mejor ficha. Eso es la siguiente lección."},
 {s:"chun",m:"happy",ja:"「今日の5問」の1問目はやさしい問題だから、さっそく挑戦してみようチュン！",en:"The first daily puzzle is an easy one, so let's give it a try! Chirp!",es:"El primer problema del diario es fácil, ¡así que probémoslo! ¡Pío!"},

{id:"shanten",title:{ja:["向聴数と受け入れ","何切るの用語を覚えよう"],en:["Shanten and acceptance","Terms used in discard puzzles"],es:["Shanten y aceptación","Términos de los problemas de descarte"]},lines:[
 {s:"chun",m:"think",ja:"問題に出てくる「向聴」と「受け入れ」って何チュン？",en:"What do 'shanten' and 'acceptance' in the puzzles mean?",es:"¿Qué significan 'shanten' y 'aceptación' en los problemas?"},
 {s:"ron",m:"normal",ja:"向聴(シャンテン)は、聴牌まであと何枚かを表す数じゃ。1向聴なら、良い牌があと1枚来れば聴牌じゃ。",en:"Shanten is how many tiles you are from tenpai. At 1-shanten, one good draw puts you in tenpai.",es:"El shanten indica a cuántas fichas estás del tenpai. Con 1-shanten, un buen robo te deja en tenpai."},
 {s:"ron",m:"normal",t:"23m456p789s55s234s",w:"14m",ja:"たとえばこの13枚は聴牌。1萬か4萬でアガリじゃ。",en:"These 13 tiles are tenpai: a 1-man or 4-man wins.",es:"Estas 13 fichas están en tenpai: gana con 1-man o 4-man."},
 {s:"kan",m:"normal",ja:"じゃあ聴牌の一歩手前が1向聴、二歩手前が2向聴ってことか。",en:"So one step before tenpai is 1-shanten, and two steps is 2-shanten.",es:"O sea, un paso antes del tenpai es 1-shanten y dos pasos, 2-shanten."},
 {s:"ron",m:"happy",ja:"その通り。何切るでは、まず向聴数を増やさない牌を切るのが基本じゃ。",en:"Exactly. In discard puzzles, first discard a tile that doesn't increase your shanten.",es:"Exacto. En los problemas de descarte, primero descarta una ficha que no aumente tu shanten."},
 {s:"chun",m:"think",ja:"受け入れは？",en:"And acceptance?",es:"¿Y la aceptación?"},
 {s:"ron",m:"normal",t:"23m",w:"14m",ja:"受け入れは、手が一歩進む牌が残り何枚あるかじゃ。23萬なら1萬と4萬が各4枚で、合わせて8枚。",en:"Acceptance is how many remaining tiles would move your hand forward. With 2-3 man, the 1-man and 4-man make 8 tiles.",es:"La aceptación es cuántas fichas quedan que harían avanzar tu mano. Con 2-3 man, el 1-man y el 4-man suman 8 fichas."},
 {s:"ron",m:"normal",ja:"向聴数が同じなら、受け入れが多い切り方ほど良い。差が1〜2枚ならほぼ互角じゃから、準正解としておる。",en:"At equal shanten, the discard with more acceptance is better. A gap of only 1 or 2 tiles is nearly even, so it counts as near-best.",es:"Con el mismo shanten, es mejor el descarte con más aceptación. Una diferencia de 1 o 2 fichas es casi igual, así que cuenta como casi correcta."},
 {s:"kan",m:"happy",ja:"なるほどな。これで「今日の5問」も怖くねえぜ！",en:"Got it. Now the daily puzzles don't scare me! Caw!",es:"Entendido. ¡Ahora el diario no me asusta! ¡Cra!"},
 {s:"chun",m:"happy",ja:"ちなみに、このアプリの何切るは牌効率（受け入れの広さ）だけで判定してるよ。役やドラは考えないチュン。",en:"By the way, discard puzzles here are judged only on tile efficiency (acceptance). Yaku and dora aren't considered. Chirp!",es:"Por cierto, aquí los descartes se evalúan solo por eficiencia (aceptación). No se consideran yaku ni dora. ¡Pío!"},
]},
{id:"waits",title:{ja:["待ちの5つの形","両面・嵌張・辺張・単騎・シャンポン"],en:["The five waits","Ryanmen, kanchan, penchan, tanki, shanpon"],es:["Las cinco esperas","Ryanmen, kanchan, penchan, tanki, shanpon"]},lines:[
 {s:"kan",m:"happy",ja:"よう、チュン。聴牌したら待ちなんて1つだろ？ オレは毎回それで勝ってるぜ。",en:"Hey Chun. Once you're tenpai there's only one wait, right? That's how I win every time. Caw!",es:"Eh, Chun. Cuando estás en tenpai solo hay una espera, ¿no? Así gano siempre. ¡Cra!"},
 {s:"ron",m:"normal",t:"23m",w:"14m",ja:"ほっほっ、カンよ。待ちには形があるのじゃ。まずは両面(リャンメン)。",en:"Ho ho, Kan. Waits come in shapes. First, the two-sided wait: ryanmen.",es:"Jo, jo, Kan. Las esperas tienen formas. Primero, la espera de dos lados: ryanmen."},
 {s:"chun",m:"think",ja:"23なら、1でも4でも順子になる！",en:"With 2-3, either a 1 or a 4 makes a sequence!",es:"Con 2-3, ¡tanto el 1 como el 4 forman escalera!"},
 {s:"ron",m:"happy",t:"24p",w:"3p",ja:"そうじゃ。2種×4枚で最大8枚。一番強い基本の待ちじゃ。次は嵌張(カンチャン)、真ん中が抜けた形。",en:"Right. Two kinds, four each: up to 8 tiles. The strongest basic wait. Next, kanchan: the closed wait, with a gap in the middle.",es:"Así es. Dos tipos, cuatro de cada uno: hasta 8 fichas. La espera básica más fuerte. Ahora el kanchan: la espera cerrada, con un hueco en medio."},
 {s:"kan",m:"happy",ja:"カンチャン！ オレの名前が入ってるじゃねえか。最強だな！",en:"Kanchan! It's got my name in it. Must be the best!",es:"¡Kanchan! Lleva mi nombre. ¡Debe ser la mejor!"},
 {s:"ron",m:"stern",t:"12s",w:"3s",ja:"3しか来んから4枚だけじゃ。辺張(ペンチャン)も同じく4枚。12なら3しか来ん。",en:"Only the 3 works, so just 4 tiles. Penchan, the edge wait, is also 4 tiles: 1-2 can only take a 3.",es:"Solo sirve el 3, así que apenas 4 fichas. El penchan, la espera de borde, también son 4: con 1-2 solo entra el 3."},
 {s:"chun",m:"normal",ja:"残りの2つは？",en:"What are the other two?",es:"¿Y las otras dos?"},
 {s:"ron",m:"normal",t:"7z",w:"7z",ja:"単騎(タンキ)は、1枚で雀頭を待つ形じゃ。",en:"Tanki waits on a single tile to make the pair.",es:"El tanki espera una ficha sola para formar la pareja."},
 {s:"ron",m:"normal",t:"33m88p",w:"3m8p",ja:"シャンポンは対子2組。どちらかが刻子になればアガリじゃ。",en:"Shanpon has two pairs, and wins when either one becomes a triplet.",es:"El shanpon tiene dos parejas y gana cuando una de ellas se convierte en trío."},
 {s:"kan",m:"oops",ja:"くっ…待ちが5種類もあったとは。次は全部見抜いてやるぜ！",en:"Ugh... five kinds of waits? Next time I'll spot them all! Caw!",es:"Uf... ¿cinco tipos de espera? ¡La próxima las veo todas! ¡Cra!"},
 {s:"chun",m:"happy",ja:"「待ち当て」で練習しようチュン！",en:"Let's practice in Waits! Chirp!",es:"¡Practiquemos en Esperas! ¡Pío!"},
]},
{id:"basics",title:{ja:["何切るの基本","孤立牌と受け入れ枚数"],en:["Discard basics","Isolated tiles and acceptance"],es:["Lo básico del descarte","Fichas aisladas y aceptación"]},lines:[
 {s:"chun",m:"think",ja:"何を切るか、いつも迷うチュン…",en:"I never know what to discard...",es:"Nunca sé qué descartar..."},
 {s:"kan",m:"happy",ja:"簡単だろ。いらなそうな牌を適当に切ればいいんだぜ。",en:"Easy. Just toss whatever looks useless. Caw!",es:"Fácil. Tira lo que parezca inútil. ¡Cra!"},
 {s:"ron",m:"stern",ja:"「適当」では強くなれんぞ。基本は、他の牌とつながらない孤立牌から切ることじゃ。",en:"'Whatever' won't make you strong. The basic rule: discard isolated tiles first, the ones that connect to nothing.",es:"'Lo que sea' no te hará fuerte. La regla básica: descarta primero las fichas aisladas, las que no conectan con nada."},
 {s:"ron",m:"normal",t:"1z9m2s5p",ja:"孤立牌は一般に、字牌→1・9→2・8→真ん中の順に使いにくい。真ん中の牌ほど、くっつく相手が多いからじゃ。",en:"Among isolated tiles, usefulness generally goes honors, then 1s and 9s, then 2s and 8s, then middle tiles. Middle tiles have more neighbors to connect with.",es:"Entre las aisladas, la utilidad suele ir así: honores, luego 1 y 9, luego 2 y 8, luego las del medio. Las del medio tienen más vecinas con las que conectar."},
 {s:"chun",m:"happy",ja:"5が一番使いやすいんだね！",en:"So the 5 is the most useful!",es:"¡Entonces el 5 es la más útil!"},
 {s:"ron",m:"normal",ja:"うむ。迷ったら受け入れ枚数を数えるのじゃ。切ったあと、何種類・何枚で手が進むか。多い方が良い打牌じゃ。",en:"Indeed. When in doubt, count your acceptance: after the discard, how many kinds and tiles move your hand forward. More is better.",es:"Así es. Si dudas, cuenta la aceptación: tras el descarte, cuántos tipos y fichas hacen avanzar tu mano. Cuantas más, mejor."},
 {s:"kan",m:"oops",ja:"枚数まで数えるのかよ…",en:"You actually count them...?",es:"¿De verdad las cuentas...?"},
 {s:"chun",m:"happy",ja:"「何切る」なら表で全部見せてくれるよ。いっしょにやろう、カン！",en:"Discard shows you the full table. Let's practice together, Kan!",es:"Descarte te muestra la tabla completa. ¡Practiquemos juntos, Kan!"},

// ===== 言語 =====
const $=s=>document.querySelector(s);
let LANG='ja';
try{
  const saved=localStorage.getItem('jangaku-lang');
  if(saved&&I18N[saved])LANG=saved;
  else{const n=(navigator.language||'ja').slice(0,2);LANG=I18N[n]?n:'en';}
}catch(e){}
function T(k,v){let s=I18N[LANG][k];if(s===undefined)s=I18N.ja[k];if(v&&typeof s==='string')s=s.replace(/\{(\w+)\}/g,(_,x)=>v[x]!==undefined?v[x]:'');return s;}
function tileLabel(i){
  if(LANG==='ja')return i<27?(i%9+1)+['萬','筒','索'][Math.floor(i/9)]:HONOR[i-27];
  return i<27?(i%9+1)+'-'+['man','pin','sou'][Math.floor(i/9)]:T('honorLabel')[i-27];
}
function tileName(i){
  if(LANG==='ja'){
    if(i<9)return (i===0?'イー':NUMREAD[i])+'ワン';
    if(i<18)return NUMREAD[i-9]+'ピン';
    if(i<27)return NUMREAD[i-18]+'ソー';
    return HONORREAD[i-27];
  }
  return i<27?tileLabel(i):T('honorName')[i-27];
}
function joinList(arr,type){
  if(LANG==='ja'||typeof Intl==='undefined'||!Intl.ListFormat)return arr.join(T('sep'));
  try{return new Intl.ListFormat(LANG,{type}).format(arr);}catch(e){return arr.join(T('sep'));}
}
function shantenText(s){return s===0?T('tenpai'):T('shanten',{s});}
function tileEl(i,cls=''){return `<span class="tile ${cls}" data-t="${i}" role="img" aria-label="${tileLabel(i)}">${tileSVG(i)}</span>`;}
function tilesRow(arr,cls=''){return arr.map(t=>tileEl(t,cls)).join('');}

// ===== チュン =====
let streak=0,tipIdx=-1;
function guide(mood,html,cls=''){return `<div class="guide ${cls}"><span class="chun hop">${chunSVG(mood)}</span><div class="bubble">${html}</div></div>`;}
function cameo(who,mood,html){return `<div class="guide cameo who-${who}"><span class="chun hop">${charSVG(who,mood)}</span><div class="bubble"><span class="nm">${T('names')[who]}</span>${html}</div></div>`;}
const LESSON_FOR={wait:'waits',nani:'shanten',score:'score'};
function lessonIdx(x){const n=Number(x);if(String(x).trim()!==''&&!isNaN(n))return n;return LESSONS.findIndex(l=>l.id===x);}
function react(ok,detail,head,ctx){
  streak=ok?streak+1:0;
  if(!head){const pool=T(ok?'ok':'ng');head=pool[rnd(pool.length)];}
  if(ok&&streak>=3)head=T('streak',{n:streak});
  let out=guide(ok?'happy':'oops',`<b>${head}</b><br>${detail}`,ok?'ok':'ng');
  if(ok){
    if(streak>=3&&streak%3===0)out+=cameo('kan','oops',T('kanStreak'));
    else if(Math.random()<.15)out+=cameo('ron','happy',T('ronPraise'));
  }else if(ctx){
    if(Math.random()<.4){const p=T('kanWrong');out+=cameo('kan','happy',p[rnd(p.length)]);}
    let h=T({wait:'ronWait',nani:'ronNani',name:'ronName',score:'ronScore',manner:'ronManner'}[ctx]);
    if(ctx in LESSON_FOR){const li=lessonIdx(LESSON_FOR[ctx]);h+=`<br><button class="link" data-lesson="${li}">${T('lessonLink',{t:(LESSONS[li].title[LANG]||LESSONS[li].title.en)[0]})}</button>`;}
    out+=cameo('ron','normal',h);
  }
  return out;
}

// ===== 成績 =====
let stats={name:{ok:0,n:0},wait:{ok:0,n:0},nani:{ok:0,n:0},score:{ok:0,n:0},manner:{ok:0,n:0}};
try{const s=JSON.parse(localStorage.getItem('jangaku-stats')||'null');if(s)stats=Object.assign(stats,s);}catch(e){}
function saveStats(){try{localStorage.setItem('jangaku-stats',JSON.stringify(stats));}catch(e){}renderStats();}
function renderStats(){for(const k of ['name','wait','nani','score','manner']){const el=document.getElementById('st-'+k);if(el)el.textContent=stats[k].n?T('stat',{ok:stats[k].ok,n:stats[k].n}):T('statNone');}}

// ===== タブ =====
const GROUPS={study:['dojo','learn','yaku','trivia'],practice:['nani','wait'],table:['score','riipai','manner']};
const SUBLABEL={dojo:'tabDojo',learn:'tabLearn',yaku:'tabYaku',trivia:'tabTrivia',nani:'tabNani',wait:'tabWait',score:'tabScore',riipai:'tabRiipai',manner:'tabManner'};
let lastInGroup={study:'dojo',practice:'nani',table:'score'},curTab='home';
function groupOf(id){for(const g in GROUPS)if(GROUPS[g].includes(id))return g;return id;}
function renderSubnav(){
  const g=groupOf(curTab),el=document.getElementById('subnav');
  if(!GROUPS[g]){el.innerHTML='';el.parentElement.hidden=true;return;}
  el.parentElement.hidden=false;
  el.innerHTML=GROUPS[g].map(x=>`<button class="chip" data-sub="${x}" aria-pressed="${x===curTab}">${T(SUBLABEL[x])}</button>`).join('');
}
function showTab(id){
  if(GROUPS[id])id=lastInGroup[id];
  const g=groupOf(id);if(GROUPS[g])lastInGroup[g]=id;
  curTab=id;
  document.querySelectorAll('.tabs button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===g);if(b.dataset.tab===g)b.setAttribute('aria-controls',id);});
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==id);
  renderSubnav();
  if(id==='home')renderHome();
  if(id==='daily')renderDaily();
  if(id==='wait'&&!waitQ)newWait();

function checkWait(redraw){
  if(!waitQ||waitQ.done)return;waitQ.done=true;
  const W=new Set(waitQ.waits);
  const ok=W.size===waitQ.sel.size&&[...W].every(t=>waitQ.sel.has(t));

  if(!redraw){stats.wait.n++;if(ok)stats.wait.ok++;saveStats();earn=earnPractice(ok);logEvent('w',ok?2:0,waitQ.hint);}

    const t=+b.dataset.t;
    if(W.has(t))b.classList.add(waitQ.sel.has(t)?'right':'missed');
    else if(waitQ.sel.has(t))b.classList.add('wrong');
  });
  const c=counts(waitQ.hand);

    c[w]++;const g=decompose(c);c[w]--;

  }).join('');
  const missed=[...W].some(t=>!waitQ.sel.has(t)),extra=[...waitQ.sel].some(t=>!W.has(t));
  const hitN=[...W].filter(t=>waitQ.sel.has(t)).length,extraN=[...waitQ.sel].filter(t=>!W.has(t)).length;
  const detail=(ok?'':T('waitPartial',{k:hitN,n:W.size})+(extraN?T('waitExtra',{e:extraN}):'')+' ')+T('waitRes',{w:joinList(waitQ.waits.map(tileLabel),'conjunction'),n:waitQ.waits.length});
  const html=redraw?guide(ok?'happy':'oops',detail,ok?'ok':'ng'):react(ok,detail,ok?'':(missed&&!extra?T('waitMissed'):''),'wait');
  $('#wait-fb').innerHTML=html+earn+rows;
  $('#wait-check').hidden=true;$('#wait-next').hidden=false;
}

let dojo={i:null,pos:0,tries:{}};
let dojoDone=new Set();
try{const OLD=['waits','basics','furiten','defense'];dojoDone=new Set(JSON.parse(localStorage.getItem('jangaku-dojo')||'[]').map(x=>typeof x==='number'?OLD[x]:x));}catch(e){}
function lineHTML(l,isNew,k){
  const side=l.s==='chun'?'right':'left';
  // 手牌が長いとき(ツモの図・実際に切る練習)は吹き出しの下に全幅で出す
  const tl=l.t?parse(l.t):[];
  const small=tl.length&&tl.length<=6&&!l.d?`<div class="ltiles">${tilesRow(tl,'mini')}${l.w?`<span class="arrow">→</span>${tilesRow(parse(l.w),'mini hl')}`:''}</div>`:'';
  let wide='';
  if(tl.length>6&&!l.d)wide=`<div class="widefig"><div class="hand">${tilesRow(tl)}</div>${l.w?`<div class="ltiles"><span class="arrow">→</span>${tilesRow(parse(l.w),'mini hl')}</div>`:''}</div>`;
  if(l.melds)wide=`<div class="meldfig">${l.melds.map(([m,sd,cap])=>`<figure>${meldHTML(m,sd)}<figcaption>${T(cap)}</figcaption></figure>`).join('')}</div>`;
  if(l.d)wide=`<div class="drawfig"><div class="hand">${tilesRow(parse(l.t))}</div><div class="drawn"><div class="hand">${tilesRow(parse(l.d),'hl')}</div><span>${T('drawLbl')}</span></div></div>`;
  if(l.try){
    const st=dojo.tries[k]||{};
    wide=`<div class="hand tryhand">${parse(l.try.hand).map(t=>`<button class="pick cut ${st.solved&&l.try.ans.includes(t)?'right':''} ${st.wrong===t&&!st.solved?'wrong':''}" data-try="${k}" data-t="${t}" ${st.solved?'disabled':''}>${tileEl(t)}</button>`).join('')}</div>`;
    if(st.solved)wide+=lineHTML({s:'chun',m:'happy',[LANG]:l.try.ok[LANG]||l.try.ok.en},false);
    else if(st.wrong!=null)wide+=lineHTML({s:'ron',m:'stern',[LANG]:l.try.ng[LANG]||l.try.ng.en},false);
  }
  return `<div class="line ${side} who-${l.s} ${isNew?'new':''}"><span class="av">${charSVG(l.s,l.m)}</span><div class="lb"><span class="nm">${T('names')[l.s]}</span><div>${l[LANG]||l.en}</div>${small}</div></div>${wide}`;
}
function pendingTry(){
  if(dojo.i===null)return false;
  const l=LESSONS[dojo.i].lines[dojo.pos-1];
  return !!(l&&l.try&&!(dojo.tries[dojo.pos-1]||{}).solved);
}
function renderDojo(animateLast){
  const el=$('#dojo-body');
  if(dojo.i===null){
    const ls=LESSONS.map((L,i)=>{
      const t=L.title[LANG]||L.title.en;const who=[...new Set(L.lines.map(x=>x.s))];
      return `<button class="lesson" data-lesson="${i}"><span class="ln">${T('lessonN',{n:i+1})}${dojoDone.has(L.id)?` <span class="donebadge">✓ ${T('done')}</span>`:''}</span><b>${t[0]}</b><span class="ld">${t[1]}</span><span class="faces">${who.map(w=>`<span class="av">${charSVG(w,'normal')}</span>`).join('')}</span></button>`;
    }).join('');
    const cast=['chun','kan','ron'].map(w=>`<div class="cast"><span class="av">${charSVG(w,w==='kan'?'normal':'happy')}</span><div><b>${T('names')[w]}</b><p>${T('profiles')[w]}</p></div></div>`).join('');
    el.innerHTML=`<h3 class="sub">${T('lessonsH')}</h3><div class="lessons">${ls}</div><h3 class="sub">${T('castH')}</h3><div class="casts">${cast}</div>`;
  }else{
    const L=LESSONS[dojo.i],t=L.title[LANG]||L.title.en;
    const lines=L.lines.slice(0,dojo.pos).map((l,k)=>lineHTML(l,animateLast&&k===dojo.pos-1,k)).join('');
    const end=dojo.pos>=L.lines.length;
    const ctrl=end?`<div class="lesson-end"><b>${T('lessonDone')}</b><div class="row">${L.nextTab?`<button class="btn" data-gotab="${L.nextTab}">${T('goLearn')}</button>`:''}${dojo.i<LESSONS.length-1?`<button class="btn ${L.nextTab?'ghost':''}" data-lesson="${dojo.i+1}">${T('nextLesson')}</button>`:''}<button class="btn ghost" data-gotab="home">${T('toHome')}</button><button class="btn ghost" data-back="1">${T('back')}</button></div></div>`
      :pendingTry()?`<p class="note tryprompt">${T('tryPrompt')}</p>`
      :`<div class="row"><button class="btn" id="dojo-next">${T('tapNext')}</button><button class="btn ghost" id="dojo-skip">${T('skip')}</button></div>`;
    el.innerHTML=`<button class="backlink" data-back="1">← ${T('back')}</button><div class="ln">${T('lessonN',{n:dojo.i+1})}</div><h3 class="lesson-title">${t[0]}</h3><div class="stage" id="stage" aria-live="polite">${lines}</div><div id="dojo-ctrl">${ctrl}</div>`;
  }
}
function groupForward(){
  const ls=LESSONS[dojo.i].lines;
  while(dojo.pos<ls.length&&ls[dojo.pos].s===ls[dojo.pos-1].s&&!ls[dojo.pos].try&&!ls[dojo.pos-1].try)dojo.pos++;
}
function openLesson(i){dojo={i,pos:1,tries:{}};groupForward();renderDojo(true);}
function advance(all){
  const L=LESSONS[dojo.i];
  if(all)L.lines.forEach((l,k)=>{if(l.try)dojo.tries[k]={solved:true};});
  dojo.pos=all?L.lines.length:Math.min(L.lines.length,dojo.pos+1);
  if(!all)groupForward();
  if(dojo.pos>=L.lines.length){if(!dojoDone.has(L.id))track('lesson-'+L.id);dojoDone.add(L.id);try{localStorage.setItem('jangaku-dojo',JSON.stringify([...dojoDone]));}catch(e){}}
  renderDojo(!all);
  const st=$('#stage'),c=$('#dojo-ctrl');const last=st&&st.lastElementChild;(dojo.pos>=LESSONS[dojo.i].lines.length&&c?c:last)?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
$('#dojo-body').addEventListener('click',e=>{
  if(e.target.closest('[data-lesson]'))return;
  const tb=e.target.closest('[data-try]');
  if(tb){
    const k=+tb.dataset.try,l=LESSONS[dojo.i].lines[k],t=+tb.dataset.t;
    dojo.tries[k]=l.try.ans.includes(t)?{solved:true}:{wrong:t};
    renderDojo(false);
    const st=$('#stage'),c=$('#dojo-ctrl');const last=st&&st.lastElementChild;(dojo.pos>=LESSONS[dojo.i].lines.length&&c?c:last)?.scrollIntoView({block:'nearest',behavior:'smooth'});
    return;
  }
  const gt=e.target.closest('[data-gotab]');if(gt){showTab(gt.dataset.gotab);window.scrollTo({top:0});return;}
  if(pendingTry())return;
  if(e.target.closest('#dojo-skip'))advance(true);
  else if(e.target.closest('[data-back]')){dojo={i:null,pos:0,tries:{}};renderDojo();window.scrollTo({top:0});}
  else if(e.target.closest('#dojo-next')||(e.target.closest('#stage')&&dojo.i!==null&&dojo.pos<LESSONS[dojo.i].lines.length))advance(false);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lesson]');if(!b)return;
  showTab('dojo');openLesson(lessonIdx(b.dataset.lesson));
});

// アクセス解析のイベント送信(GoatCounterを有効にしたときだけ動く)
function track(name){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:name,title:name,event:true});}catch(e){}}
// 初回訪問から何日目に開いたかを、1日1回だけ送る(D1・D7の継続率を見るため。個人を特定する情報は送らない)
(function(){try{
  const today=new Date();const key=`${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  let first=localStorage.getItem('jangaku-first');if(!first){first=String(Date.now());localStorage.setItem('jangaku-first',first);}
  if(localStorage.getItem('jangaku-lastday')!==key){
    localStorage.setItem('jangaku-lastday',key);
    const d=Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate())-new Date(new Date(+first).setHours(0,0,0,0)))/86400000);
    window.addEventListener('load',()=>setTimeout(()=>track('day-'+Math.min(d,30)),1500));
  }
}catch(e){}})();
const DAY0=Date.UTC(2026,8,26);
function todayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function keyToUTC(k){const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d);}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function withSeed(seed,fn){const prev=RNG;RNG=mulberry32(seed);try{return fn();}finally{RNG=prev;}}

let daily=null,dailyView=null,dailyTimer=null,dailyStarted=false;
let dstore={days:{}};
try{const s=JSON.parse(localStorage.getItem('jangaku-daily')||'null');if(s&&s.days)dstore=s;}catch(e){}
function saveDaily(){
  const keys=Object.keys(dstore.days).sort();
  while(keys.length>400)delete dstore.days[keys.shift()];
  try{localStorage.setItem('jangaku-daily',JSON.stringify(dstore));}catch(e){}
}
function ensureDaily(){
  const key=todayKey();
  if(daily&&daily.key===key)return;
  daily={key,n:Math.round((keyToUTC(key)-DAY0)/86400000)+1,
    qs:DAILY_LV.map((lv,i)=>withSeed(hashStr(key+'#v2#'+i),()=>genNanikiru(lv))),
    kanRes:DAILY_LV.map((lv,i)=>withSeed(hashStr(key+'#kan#'+i),()=>rnd(100)<KAN_RATE[lv]))};
  daily.kan=daily.kanRes.filter(Boolean).length;
  dailyView=null;
}
const DAILY_V=2,DAILY_LV=['easy','medium','medium','hard','hard'],KAN_RATE={easy:90,medium:65,hard:40};
function rec(){let r=dstore.days[daily.key];if(!r||r.v!==DAILY_V)r=dstore.days[daily.key]={v:DAILY_V,picks:[]};return r;}
// 2=最善 1.5=準正解(最善との差が2枚以内) 1=向聴数キープ 0=後退
const NEAR=2;
function grade(q,t){
  const best=q.ev[0],m=q.ev.find(x=>x.tile===t);
  if(!m||m.shanten!==best.shanten)return 0;
  if(m.total===best.total)return 2;
  return best.total-m.total<=NEAR?1.5:1;
}
function sq(g){return g===2?'🟩':g===1.5?'🟦':g===1?'🟨':'🟥';}
function bestTiles(q){const b=q.ev[0];return q.ev.filter(x=>x.shanten===b.shanten&&x.total===b.total).map(x=>x.tile);}
function dailyStats(){
  const done=Object.keys(dstore.days).filter(k=>(dstore.days[k].picks||[]).length>=5).sort();
  const played=done.length;
  const avg=played?done.reduce((a,k)=>a+(dstore.days[k].score||0),0)/played:0;
  const set=new Set(done);
  let t=keyToUTC(todayKey());
  if(!set.has(todayKey()))t-=86400000;
  const fromUTC=u=>new Date(u).toISOString().slice(0,10);
  let streak=0;while(set.has(fromUTC(t))){streak++;t-=86400000;}
  let max=0,run=0,prev=null;
  for(const k of done){const u=keyToUTC(k);run=(prev!==null&&u-prev===86400000)?run+1:1;max=Math.max(max,run);prev=u;}
  return {played,avg,streak,max};
}
function countdown(){
  const now=new Date(),next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  let s=Math.max(0,Math.floor((next-now)/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function shareText(){
  const r=rec(),gs=r.picks.map((t,k)=>grade(daily.qs[k],t));
  return `${T('shareHead',{n:daily.n,s:r.score})}\n${gs.map(sq).join('')}\n${T('shareVs',{k:daily.kan})}${(r.hints||[]).reduce((a,b)=>a+(b||0),0)?` 📜×${(r.hints||[]).reduce((a,b)=>a+(b||0),0)}`:''}\n${SHARE_URL}`;
}

function renderDaily(){
  const el=$('#daily-body');
  if(!daily||daily.key!==todayKey()){
    el.innerHTML=`<p class="note">${T('making')}</p>`;
    setTimeout(()=>{ensureDaily();renderDaily();},20);
    return;
  }
  const r=rec();
  const dateStr=new Date(keyToUTC(daily.key)+43200000).toLocaleDateString(LANG,{month:'long',day:'numeric',weekday:'short',timeZone:'UTC'});
  const cur=dailyView!==null?dailyView:r.picks.length;
  const dots=[0,1,2,3,4].map(k=>{const g=k<r.picks.length?grade(daily.qs[k],r.picks[k]):-1;return `<span class="dot g${String(g).replace('.','')} ${k===cur&&cur<5?'cur':''}"></span>`;}).join('');
  const head=`<div class="dhead"><div><div class="ln">${T('dailyH')} #${daily.n}</div><b>${dateStr}</b></div><div class="dots">${dots}</div></div>`;
  if(cur>=5){el.innerHTML=head+resultHTML();startTimer();return;}
  if(r.picks.length===0&&!dailyStarted){
    el.innerHTML=head+`<div class="block dstart">
      <h3>${T('dStartTitle')}</h3>
      <p>${T('dStartDesc')}</p>
      <div class="lvrow">${DAILY_LV.map((lv,i)=>`<span class="lv lv-${lv}">${i+1}. ${T('lv_'+lv)}</span>`).join('')}</div>
      <div class="vs small"><div><span class="av">${chunSVG('happy')}</span><span class="vl">${T('you')}</span></div><span class="vsx">vs</span><div><span class="av">${kanSVG('normal')}</span><span class="vl">${T('names').kan}</span></div></div>
      <p class="note">${T('dStartKan')}</p>
      <button class="btn share" id="daily-start">${T('dStartBtn')}</button>
      <p class="note"><button class="link" data-lesson="nanikiru">${T('dStartNew')}</button></p>
    </div>`;
    return;
  }
  const q=daily.qs[cur],answered=cur<r.picks.length,pick=r.picks[cur];
  const bt=bestTiles(q),hl=(r.hints||[])[cur]||0,cands=answered?null:naniCands(q,hl);
  let marked=false;
  const hand=q.hand.map(t=>{
    let cls='';
    if(answered){if(bt.includes(t))cls='right';else if(t===pick&&!marked){cls=grade(q,pick)>=1.5?'near':'wrong';marked=true;}}
    else if(cands)cls=cands.includes(t)?'glow':'dim';
    return `<button class="pick cut ${cls}" data-dt="${t}" ${answered?'tabindex="-1"':''}>${tileEl(t)}</button>`;
  }).join('');
  let fb='';
  if(answered){
    const g=grade(q,pick),b=joinList(bt.map(tileLabel),'disjunction');
    const msg=g===2?T('dGood'):g===1.5?T('dNear',{b,d:q.ev[0].total-q.ev.find(x=>x.tile===pick).total}):T(g===1?'dOk':'dBack',{b});
    const m=q.ev.find(x=>x.tile===pick);
    const detail=T('naniRes',{t:tileLabel(pick),s:shantenText(m.shanten),n:m.total,b,m:q.ev[0].total});
    const rows=q.ev.map(x=>`<tr class="${bt.includes(x.tile)?'best':''} ${x.tile===pick?'mine':''}"><td>${tileEl(x.tile,'mini')}</td><td>${shantenText(x.shanten)}</td><td class="num">${T('ukeCell',{k:x.tiles.length,n:x.total})}</td><td><div class="uke">${tilesRow(x.tiles,'micro')}</div></td></tr>`).join('');
    fb='<div role="status">'+guide(g>=1.5?'happy':g===1?'think':'oops',`<b>${msg}</b><br>${detail}`,g>=1.5?'ok':'ng')+'</div>'
      +`<div class="row"><button class="btn" id="daily-next">${cur===4?T('seeResult'):T('next')}</button></div>`
      +`<details class="cmp"><summary>${T('compare')}</summary><div class="scroll"><table><thead><tr><th>${T('thDiscard')}</th><th>${T('thShanten')}</th><th>${T('thUke')}</th><th>${T('thTiles')}</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  }
  el.innerHTML=head+`<div class="block"><p class="note"><b>${T('dailyQ',{i:cur+1})}</b> <span class="lv lv-${q.level}">${T('lv_'+q.level)}</span>　${T('naniInfo',{s:shantenText(q.shanten)})}</p><div class="hand">${hand}</div>${answered?'':glossHTML('nani')}${hintArea('nani',q,hl,answered)}${fb}</div>`;
}
function resultHTML(){
  const r=rec(),gs=r.picks.map((t,k)=>grade(daily.qs[k],t)),s=r.score,k=daily.kan;
  const res=s>k?'kanLose':s===k?'kanTie':'kanWin';
  const st=dailyStats();

    <div class="dstats"><div><b>${st.played}</b><span>${T('played')}</span></div><div><b>${st.avg.toFixed(1)}</b><span>${T('avg')}</span></div><div><b>${st.streak}</b><span>${T('streakL')}</span></div><div><b>${st.max}</b><span>${T('maxStreak')}</span></div></div>
    <button class="btn share" id="daily-share">${T('share')}</button>
    <div id="share-fb"></div>
    ${r.rewarded?`<p class="toast">${T('dailyReward')}</p>`:''}
    <p class="note" id="countdown">${T('nextIn',{t:countdown()})}</p>
  </div>
  ${chars}
  <h3 class="sub">${T('reviewH')}</h3>${review}`;
}
function startTimer(){
  if(dailyTimer)return;
  dailyTimer=setInterval(()=>{
    const el=document.getElementById('countdown');
    if(daily&&daily.key!==todayKey()&&!$('#daily').hidden){renderDaily();return;}
    if(el)el.textContent=T('nextIn',{t:countdown()});
  },1000);
}
async function shareDaily(){
  const text=shareText(),fb=$('#share-fb');
  // 共有メニューが開かない環境でも必ずコピーできるよう、先に文面を表示しておく
  fb.innerHTML=`<p class="note">${T('copyManual')}</p><textarea class="sharebox" readonly>${text}</textarea><div class="row" style="justify-content:center"><button class="btn ghost" id="copy-btn">${T('copyBtn')}</button><span id="copy-ok"></span></div>`;
  try{if(navigator.share)await navigator.share({text});}catch(e){}

$('#daily-body').addEventListener('click',async e=>{
  if(e.target.closest('#copy-btn')){
    const ta=$('#share-fb textarea');let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(err){}
    if(!ok){ta.focus();ta.select();try{ok=document.execCommand('copy');}catch(err){}}
    $('#copy-ok').innerHTML=ok?`<span class="copied">${T('copied')}</span>`:'';
    return;
  }
  const c=e.target.closest('[data-dt]');
  if(c){
    const r=rec();const cur=dailyView!==null?dailyView:r.picks.length;
    if(cur!==r.picks.length||cur>=5)return;
    r.picks.push(+c.dataset.dt);
    const g=grade(daily.qs[cur],+c.dataset.dt);
    if(g>=1.5){streak++;}else streak=0;
    logEvent('d',g,(r.hints||[])[cur]||0);
    if(r.picks.length>=5){r.score=r.picks.filter((t,k)=>grade(daily.qs[k],t)>=1.5).length;if(!r.rewarded){r.rewarded=true;addScrolls(2);}track('daily-complete');}
    saveDaily();dailyView=cur;renderDaily();
    return;
  }
  if(e.target.closest('#daily-start')){dailyStarted=true;track('daily-start');renderDaily();return;}
  if(e.target.closest('#daily-next')){dailyView=null;renderDaily();window.scrollTo({top:$('#daily').offsetTop-60,behavior:'smooth'});return;}
  if(e.target.closest('#daily-share')){track('daily-share');shareDaily();}
});
